# Antennes-relais (ANFR) pour l'écran M07 TOWERS : tuiles régénérées chaque semaine dans cells/.
name: Antennes-relais ANFR
on:
  schedule:
    - cron: '17 6 * * 5'        # vendredi, après la publication hebdomadaire de l'ANFR
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_cells.py', '.github/workflows/cells.yml']
permissions:
  contents: write
concurrency:
  group: cells
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construire les tuiles
        run: python3 tools/build_cells.py
      - name: Publier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A cells
          if git diff --cached --quiet; then echo 'Aucun changement'; exit 0; fi
          git commit -m "Antennes-relais ANFR $(python3 -c "import json;print(json.load(open('cells/index.json'))['d'])")"
          git pull --rebase origin main
          git push origin HEAD:main
