/* Console plein écran : grille de caractères dessinée sur un canvas. Look unique, sombre, par choix (terminal Soyuz). */

<script>
'use strict';
/* =====================================================================================================
   ГРАФИТ · GRAFIT OS MOBILE — noyau sans DOM : thème, tampon d'écran, composants Soyuz, éphémérides,
   tendance barométrique (ДЕП). Ports de grafit/theme.py, screen.py, widgets.py, astro.py et de
   Scripts/lib/pressure_trend.lua (PK8-S16A fw 0.4.1). Même logique, mêmes unités.
   ===================================================================================================== */

// ---------------------------------------------------------------------------------------- thème
const BG = [10, 12, 14];
const mix = (c, a, bg = BG) => c.map((v, i) => Math.round(v * a + bg[i] * (1 - a)));
const WHITE = [207, 210, 212], DIM = mix(WHITE, 0.62), FAINT = mix(WHITE, 0.30), LINE = mix(WHITE, 0.55),
  TRACKC = mix(WHITE, 0.14), INK = [12, 15, 18], RED = [158, 74, 74], REDT = [194, 106, 106],
  REDINK = [246, 236, 236], REDDIM = mix(RED, 0.45), BGT = [5, 6, 7];
const STYLES = [];
function S(fg = WHITE, bg = BG, bold = false) {
  STYLES.push({ fg: 'rgb(' + fg.join(',') + ')', bg: 'rgb(' + bg.join(',') + ')', base: bg === BG, bold });
  return STYLES.length - 1;
}
const t = {};
t.N = S(); t.B = S(WHITE, BG, true); t.D = S(DIM); t.F = S(FAINT); t.L = S(LINE); t.K = S(TRACKC);
t.R = S(REDT); t.RB = S(REDT, BG, true); t.RR = S(RED); t.RZ = S(REDDIM);
t.INV = S(INK, WHITE, true); t.INVN = S(INK, WHITE); t.ALERT = S(REDINK, RED, true);
t.T = S(WHITE, BGT, true); t.TD = S(DIM, BGT); t.TF = S(FAINT, BGT); t.TR = S(REDT, BGT, true);
t.TB = S(FAINT, BGT); // bande titre : filets

// ---------------------------------------------------------------------------------------- texte
// Une cellule = un caractère (les diacritiques combinants restent dans la cellule précédente).
function chars(s) {
  const out = [];
  for (const c of String(s)) {
    const cp = c.codePointAt(0);
    if (cp >= 0x300 && cp <= 0x36f && out.length) out[out.length - 1] += c; else out.push(c);
  }
  return out;
}
const slen = s => chars(s).length;
function clip(s, n) {
  const c = chars(s);
  if (n <= 0) return '';
  return c.length <= n ? c.join('') : (n > 1 ? c.slice(0, n - 1).join('') + '…' : c.slice(0, n).join(''));
}
const ljust = (s, n) => { s = String(s); return s + ' '.repeat(Math.max(0, n - slen(s))); };
const rjustS = (s, n) => { s = String(s); return ' '.repeat(Math.max(0, n - slen(s))) + s; };
const center = (s, n) => { s = String(s); const p = Math.max(0, n - slen(s)); const l = Math.floor(p / 2); return ' '.repeat(l) + s + ' '.repeat(p - l); };
const pad2 = n => String(Math.floor(n)).padStart(2, '0');
const fmtf = (v, d) => (v == null || !isFinite(v)) ? '—' : v.toFixed(d);

// ---------------------------------------------------------------------------------------- écran
class Screen {
  constructor(w, h) { this.resize(w, h); }
  resize(w, h) { this.w = w; this.h = h; this.ch = new Array(w * h).fill(' '); this.st = new Uint8Array(w * h); }
  clear(style = t.N) { this.ch.fill(' '); this.st.fill(style); this.vec = []; }
  vector(x, y, w, h, fn, clip = true) { (this.vec || (this.vec = [])).push({ x, y, w, h, fn, clip }); }
  put(x, y, text, style = t.N, w) {
    if (y < 0 || y >= this.h || text == null) return 0;
    let c = chars(text);
    if (w != null) c = c.slice(0, Math.max(0, w));
    let n = 0;
    for (let i = 0; i < c.length; i++) {
      const xi = x + i;
      if (xi >= this.w) break;
      if (xi >= 0) { this.ch[y * this.w + xi] = c[i]; this.st[y * this.w + xi] = style; n++; }
    }
    return c.length;
  }
  fill(x, y, w, h, c = ' ', style = t.N) { for (let yy = Math.max(0, y); yy < Math.min(this.h, y + h); yy++) this.put(x, yy, c.repeat(Math.max(0, w)), style); }
  get(x, y) { return (x >= 0 && x < this.w && y >= 0 && y < this.h) ? this.ch[y * this.w + x] : ' '; }
  text() { const out = []; for (let y = 0; y < this.h; y++) out.push(this.ch.slice(y * this.w, (y + 1) * this.w).join('').replace(/\s+$/, '')); return out.join('\n'); }
}

// ---------------------------------------------------------------------------------------- composants
class Rect {
  constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
  get r() { return this.x + this.w; }
  get b() { return this.y + this.h; }
  inset(dx = 1, dy = 1) { return new Rect(this.x + dx, this.y + dy, Math.max(0, this.w - 2 * dx), Math.max(0, this.h - 2 * dy)); }
  splitH(weights, gap = 1) {
    const fixed = weights.filter(w => w < 0).reduce((a, w) => a - w, 0);
    const flex = weights.filter(w => w > 0).reduce((a, w) => a + w, 0) || 1;
    const free = this.w - fixed - gap * (weights.length - 1);
    const out = []; let x = this.x;
    weights.forEach((w, i) => {
      let ww = w < 0 ? -w : Math.floor(free * w / flex);
      if (i === weights.length - 1) ww = this.r - x;
      out.push(new Rect(x, this.y, ww, this.h)); x += ww + gap;
    });
    return out;
  }
  splitV(weights, gap = 0) {
    const fixed = weights.filter(w => w < 0).reduce((a, w) => a - w, 0);
    const flex = weights.filter(w => w > 0).reduce((a, w) => a + w, 0) || 1;
    const free = this.h - fixed - gap * (weights.length - 1);
    const out = []; let y = this.y;
    weights.forEach((w, i) => {
      let hh = w < 0 ? -w : Math.floor(free * w / flex);
      if (i === weights.length - 1) hh = this.b - y;
      out.push(new Rect(this.x, y, this.w, hh)); y += hh + gap;
    });
    return out;
  }
}

const W = {};
W.rjust = (scr, xr, y, text, style = t.N) => { text = String(text); scr.put(xr - slen(text), y, text, style); };

W.panel = (scr, r, code, name, rt = '', rtStyle = t.TD, alert = false) => {
  if (r.w < 8 || r.h < 3) return new Rect(r.x, r.y, 0, 0);
  scr.fill(r.x, r.y, r.w, 1, ' ', t.T);
  let x = r.x;
  if (code) { scr.put(x, r.y, ' ' + code + ' ', alert ? t.ALERT : t.INV); x += slen(code) + 3; } else x += 1;
  rt = String(rt);
  const room = r.r - x - 1 - (rt ? slen(rt) + 2 : 0);
  scr.put(x, r.y, clip(name, room), t.T);
  if (rt) W.rjust(scr, r.r - 1, r.y, clip(rt, r.w - 8), rtStyle);
  for (let y = r.y + 1; y < r.b - 1; y++) { scr.put(r.x, y, '│', t.L); scr.put(r.r - 1, y, '│', t.L); }
  const y = r.b - 1;
  scr.put(r.x, y, '┗━' + '─'.repeat(Math.max(0, r.w - 4)) + '━┛', t.L);
  scr.put(r.x, y, '┗━', t.N);
  scr.put(r.r - 2, y, '━┛', t.N);
  return new Rect(r.x + 2, r.y + 1, r.w - 4, r.h - 2);
};

W.segBar = (scr, x, y, w, frac, redFrom = 0.8, alert = false) => {
  if (w <= 0) return;
  frac = (frac == null || frac !== frac) ? 0 : Math.max(0, Math.min(1, frac));
  const n = Math.round(frac * w);
  const red0 = redFrom != null ? Math.round(redFrom * w) : w;
  for (let i = 0; i < w; i++) {
    const on = i < n;
    const st = i >= red0 ? (on ? t.RR : t.RZ) : (on ? (alert ? t.RR : t.N) : t.K);
    scr.put(x + i, y, '■', st);
  }
};

W.thinBar = (scr, x, y, w, frac, alert = false) => {
  if (w <= 0) return;
  frac = (frac == null || frac !== frac) ? 0 : Math.max(0, Math.min(1, frac));
  const n = Math.round(frac * w);
  scr.put(x, y, '━'.repeat(n), alert ? t.RR : t.N);
  scr.put(x + n, y, '─'.repeat(w - n), t.K);
};

const BR = [[0x01, 0x08], [0x02, 0x10], [0x04, 0x20], [0x40, 0x80]];
W.canvas = (w, h) => Array.from({ length: Math.max(0, h) }, () => new Array(Math.max(0, w)).fill(0));
W.dot = (cells, px, py) => {
  px = Math.floor(px); py = Math.floor(py);
  const cx = Math.floor(px / 2), sx = px - cx * 2, cy = Math.floor(py / 4), sy = py - cy * 4;
  if (cy >= 0 && cy < cells.length && cx >= 0 && cx < cells[0].length) cells[cy][cx] |= BR[sy][sx];
};
W.line = (cells, x0, y0, x1, y1) => {
  const n = Math.floor(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) + 1;
  for (let i = 0; i <= n; i++) { const f = i / n; W.dot(cells, x0 + (x1 - x0) * f, y0 + (y1 - y0) * f); }
};
W.dashed = (cells, x0, y0, x1, y1, on = 2, off = 2) => {
  const n = Math.floor(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) + 1;
  for (let i = 0; i <= n; i++) { if (i % (on + off) < on) { const f = i / n; W.dot(cells, x0 + (x1 - x0) * f, y0 + (y1 - y0) * f); } }
};
W.circle = (cells, cx, cy, r, step = 4) => { for (let a = 0; a < 360; a += step) W.dot(cells, cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)); };
W.blit = (scr, x, y, cells, style = t.N) => {
  cells.forEach((row, cy) => row.forEach((c, cx) => { if (c) scr.put(x + cx, y + cy, String.fromCharCode(0x2800 + c), style); }));
};
W.brailleArea = (scr, x, y, w, h, values, vmax, style = t.N, fill = true) => {
  if (w <= 0 || h <= 0) return;
  let pts = values.slice(-(w * 2));
  pts = new Array(w * 2 - pts.length).fill(0).concat(pts);
  const top = vmax || Math.max(Math.max(...pts), 1e-9);
  const dh = h * 4, cells = W.canvas(w, h);
  pts.forEach((v, i) => {
    const lv = v == null ? 0 : Math.round(Math.max(0, Math.min(1, v / top)) * dh);
    const cx = Math.floor(i / 2), sub = i % 2;
    const from = fill ? dh - lv : (lv ? dh - lv : dh);
    const to = fill ? dh : (lv ? dh - lv + 1 : dh);
    for (let d = from; d < to; d++) cells[Math.floor(d / 4)][cx] |= BR[d % 4][sub];
  });
  W.blit(scr, x, y, cells, style);
};

W.kv = (scr, x, y, w, key, value, ks = t.D, vs = t.N, dots = true) => {
  value = String(value);
  scr.put(x, y, clip(key, w), ks);
  if (dots) { const gap = w - slen(key) - slen(value) - 2; if (gap > 0) scr.put(x + slen(key) + 1, y, '·'.repeat(gap), t.F); }
  W.rjust(scr, x + w, y, clip(value, w - slen(key) - 1), vs);
};

W.box = (scr, x, y, w, h, style = t.L, fill = null) => {
  if (w < 2 || h < 2) return;
  scr.put(x, y, '┌' + '─'.repeat(w - 2) + '┐', style);
  for (let yy = y + 1; yy < y + h - 1; yy++) {
    scr.put(x, yy, '│', style); scr.put(x + w - 1, yy, '│', style);
    if (fill != null) scr.put(x + 1, yy, ' '.repeat(w - 2), fill);
  }
  scr.put(x, y + h - 1, '└' + '─'.repeat(w - 2) + '┘', style);
};

const TILE = {
  nom: [t.F, t.D, t.F, null], caut: [t.RR, t.RB, t.R, null], crit: [t.ALERT, t.ALERT, t.ALERT, t.ALERT],
  critoff: [t.RR, t.R, t.R, null], on: [t.INV, t.INV, t.INVN, t.INV], lit: [t.N, t.B, t.N, null], na: [t.K, t.F, t.F, null],
};
W.tile = (scr, x, y, w, h, label, value = '', state = 'nom') => {
  const [bst, lst, vst, fill] = TILE[state] || TILE.nom;
  W.box(scr, x, y, w, h, bst, fill);
  const room = h - 2;
  const lines = String(label).split('\n').filter(Boolean).slice(0, Math.max(1, room)).map(s => [s, lst]);
  if (value !== '' && room > lines.length) lines.push([String(value), vst]);
  const top = y + 1 + Math.max(0, Math.floor((room - lines.length) / 2));
  lines.forEach(([s, st], i) => scr.put(x + 1, top + i, center(clip(s, w - 2), w - 2), st));
};
// Panneau d'annonciateurs à filets communs. items = [[libellé, état]]. Renvoie la hauteur.
W.tileGrid = (scr, x, y, cols, cw, items, hits) => {
  const rows = Math.ceil(items.length / cols);
  for (let r = 0; r <= rows; r++) {
    const [l, m, rr] = r === 0 ? ['┌', '┬', '┐'] : (r === rows ? ['└', '┴', '┘'] : ['├', '┼', '┤']);
    scr.put(x, y + 2 * r, l + Array.from({ length: cols }, () => '─'.repeat(cw)).join(m) + rr, t.F);
  }
  for (let i = 0; i < rows * cols; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    scr.put(x + c * (cw + 1), y + 2 * r + 1, '│', t.F);
    scr.put(x + (c + 1) * (cw + 1), y + 2 * r + 1, '│', t.F);
  }
  items.forEach(([label, state, fn], i) => {
    const r = Math.floor(i / cols), c = i % cols, cx = x + c * (cw + 1), cy = y + 2 * r;
    const [, lst, , fill] = TILE[state] || TILE.nom;
    if (state === 'caut' || state === 'critoff' || state === 'crit') {
      scr.put(cx + 1, cy, '─'.repeat(cw), t.RR); scr.put(cx + 1, cy + 2, '─'.repeat(cw), t.RR);
      scr.put(cx, cy + 1, '│', t.RR); scr.put(cx + cw + 1, cy + 1, '│', t.RR);
      for (const [xx, yy] of [[cx, cy], [cx + cw + 1, cy], [cx, cy + 2], [cx + cw + 1, cy + 2]]) scr.put(xx, yy, scr.get(xx, yy), t.RR);
    }
    scr.put(cx + 1, cy + 1, center(clip(label, cw), cw), fill != null ? fill : lst);
    if (state === 'crit') scr.put(cx + 1, cy + 1, center(clip(label, cw), cw), t.ALERT);
    if (hits && fn) hits.push({ x: cx + 1, y: cy + 1, w: cw, h: 1, fn });
  });
  return rows * 2 + 1;
};

W.limStyle = active => active ? t.RR : t.RZ;

// 7 segments en traits gras des caractères de cadre
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg', '5': 'acdfg', '6': 'acdefg', '7': 'abc',
  '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '', 'A': 'abcefg', 'b': 'cdefg', 'C': 'adef', 'd': 'bcdeg', 'E': 'adefg',
  'F': 'aefg', 'H': 'bcefg', 'L': 'def', 'P': 'abefg', 'r': 'eg', 'o': 'cdeg', 'n': 'ceg', 'U': 'bcdef', 't': 'defg',
  'S': 'acdfg', 'I': 'bc', 'O': 'abcdef', 'G': 'acdef', 'i': 'c', 'u': 'cde', 'y': 'bcdfg', 'J': 'bcde', 'h': 'cefg' };
const HV = { '0000': ' ', '1000': '╹', '0100': '╻', '0010': '╸', '0001': '╺', '1100': '┃', '0011': '━', '0101': '┏',
  '0110': '┓', '1001': '┗', '1010': '┛', '1101': '┣', '1110': '┫', '0111': '┳', '1011': '┻', '1111': '╋' };
function segDirs(segs) {
  const [a, b, c, d, e, f, g] = 'abcdefg'.split('').map(k => segs.includes(k) ? 1 : 0);
  return [[[0, f, 0, a], [0, 0, a, a], [0, b, a, 0]], [[f, e, 0, g], [0, 0, g, g], [b, c, g, 0]], [[e, 0, 0, d], [0, 0, d, d], [c, 0, d, 0]]];
}
const GHOST = segDirs('abcdefg');
W.seg7Width = text => Math.max(0, chars(text).reduce((a, ch) => a + (ch === '.' ? 0 : (ch === ':' ? 2 : 4)), 0) - 1);
W.readout = (scr, x, y, w, label, text, unit = '', style = t.N, alert = false, ghost = true, ndig = null, uw = null) => {
  text = ndig ? String(text).trim() : String(text);
  if (ndig) text = ' '.repeat(Math.max(0, ndig - chars(text).filter(c => c !== '.' && c !== ':').length)) + text;
  W.box(scr, x, y, w, 5, alert ? t.RR : t.L);
  scr.put(x + 2, y, ' ' + label + ' ', alert ? t.RB : t.D);
  uw = Math.max(uw || 0, slen(unit));
  const sx = x + w - 2 - (uw ? uw + 1 : 0) - W.seg7Width(text);
  W.seg7(scr, Math.max(x + 2, sx), y + 1, text, alert ? t.RB : style, ghost ? t.K : null);
  if (unit) scr.put(x + w - 2 - uw, y + 3, unit, alert ? t.R : t.D);
};

const V8 = ' ▁▂▃▄▅▆▇█', H8 = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
const frac01 = f => (f == null || f !== f) ? 0 : Math.max(0, Math.min(1, f));

// Ruban vertical gradué (largeur 8)
W.vtape = (scr, x, y, h, frac, value = '', label = '', alert = false, marks = [], top = '', bot = '', stale = false, low = false) => {
  const th = h - 6;
  if (th < 2) return;
  frac = frac01(frac);
  marks = marks.slice().sort((a, b) => a[0] - b[0]);
  const act = marks.map(m => !stale && (low ? frac <= m[0] : frac >= m[0]));
  scr.put(x + 1, y, '┌──┐', t.L); scr.put(x + 5, y, top, t.F);
  const n8 = Math.round(frac * th * 8);
  for (let i = 0; i < th; i++) {
    const lb = th - 1 - i, fLo = lb / th, fHi = (lb + 1) / th;
    let fill = '  ';
    if (lb < Math.floor(n8 / 8)) fill = '██'; else if (lb === Math.floor(n8 / 8) && n8 % 8) fill = V8[n8 % 8].repeat(2);
    const tick = [0.25, 0.5, 0.75].some(q => Math.abs(fHi - q) < 0.5 / th);
    let rst = t.L, z = null;
    if (low) { z = marks.findIndex(m => fLo < m[0] - 1e-9); if (z < 0) z = null; }
    else { for (let k = marks.length - 1; k >= 0; k--) if (fHi > marks[k][0] + 1e-9) { z = k; break; } }
    if (z != null) rst = W.limStyle(act[z]);
    let mk = marks.findIndex(m => Math.abs(fHi - m[0]) < 0.5 / th); if (mk < 0) mk = null;
    scr.put(x + 1, y + 1 + i, '│', t.L);
    scr.put(x + 2, y + 1 + i, fill, alert ? t.RR : t.N);
    scr.put(x + 4, y + 1 + i, (tick || mk != null) ? '├' : '│', mk != null ? W.limStyle(act[mk]) : rst);
    if (mk != null && marks[mk][1]) scr.put(x + 5, y + 1 + i, marks[mk][1], act[mk] ? t.R : t.RZ);
  }
  scr.put(x + 1, y + th + 1, '└──┘', t.L); scr.put(x + 5, y + th + 1, bot, t.F);
  const lvl = n8 > 0 ? Math.floor((n8 - 1) / 8) : 0;

// Barre horizontale encadrée (3 lignes)
W.hbar = (scr, x, y, w, frac, alert = false, marks = [], ticks = 4, center0 = false) => {
  const iw = w - 2;
  if (iw < 2) return;
  frac = frac01(frac);
  scr.put(x, y, '┌' + '─'.repeat(iw) + '┐', t.L);
  scr.put(x, y + 1, '│', t.L);
  if (center0) {                                   // barre centrée (valeurs signées : 0,5 = zéro)
    const mid = iw / 2, pos = frac * iw;
    const a = Math.min(mid, pos), b = Math.max(mid, pos);
    let body = '';
    for (let i = 0; i < iw; i++) body += (i + 0.5 >= a && i + 0.5 <= b) ? '█' : ' ';
    scr.put(x + 1, y + 1, body, alert ? t.RR : t.N);
  } else {
    const n = Math.round(frac * iw * 8), full = Math.floor(n / 8), part = n % 8;
    const body = '█'.repeat(full) + (part ? H8[part] : '');

  }
  scr.put(x + iw + 1, y + 1, '│', t.L);

  const markCols = {}; marks.forEach((m, k) => { markCols[Math.round(m * iw) - 1] = k; });
  scr.put(x, y + 2, '└', t.L);
  for (let i = 0; i < iw; i++) {

    let z = null; for (let k = marks.length - 1; k >= 0; k--) if (f > marks[k]) { z = k; break; }
    const st = z == null ? t.L : W.limStyle(act[z]);

};

W.relTime = s => {

// Les courbes, cartes et instruments sont des dessins vectoriels posés sur la grille : une commande vectorielle

// Courbe monotone (Fritsch–Carlson, comme curveMonotoneX de d3) : pas de dépassement entre deux points.
W.mono = (c, pts) => {
  const n = pts.length;
  if (!n) return;
  c.moveTo(pts[0][0], pts[0][1]);

// Spline de Catmull-Rom (traces au sol, passages) : passe par chaque point, x non monotone admis.
W.spline = (c, pts, close = false) => {

  const P = i => close ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  c.moveTo(pts[0][0], pts[0][1]);

// 7 segments vectoriels : segments hexagonaux, segments éteints visibles (fantôme)
function seg7Digit(c, x, y, w, h, segs, color) {

    e: () => vt(L + th / 2, M + g, B - th / 2 - g), c: () => vt(R - th / 2, M + g, B - th / 2 - g) };

  for (const s of segs) if (S[s]) S[s]();

W.seg7 = (scr, x, y, text, style = t.N, ghost = null) => {
  const items = []; let cx = 0;
  for (const ch of chars(text)) {
    if (ch === '.') { items.push(['dp', cx - 1]); continue; }
    if (ch === ':') { items.push(['col', cx]); cx += 2; continue; }
    items.push(['d', cx, SEG[ch] || '']); cx += 4;
  }

// Courbe(s) avec axes. Axes, graduations et libellés en cellules ; tracé, aire, grille et seuils en vecteurs,
// à leur valeur exacte. series = [[valeurs, style]], la plus récente en dernier, une valeur toutes les step s.
W.plot = (scr, r, series, o = {}) => {
  const fmt = o.fmt || (v => String(+v.toFixed(3)));
  const unit = o.unit || '', limits = o.limits || [], marker = o.marker !== false, grid = o.grid !== false;
  const step = o.step || 1, xfmt = o.xfmt || W.relTime, xminCells = o.xminCells || 12;
  const vals = []; series.forEach(([s]) => s.forEach(v => { if (v != null) vals.push(v); }));
  let vmin = o.vmin != null ? o.vmin : 0, vmax = o.vmax;
  if (o.auto && vals.length) {
    const lo = Math.min(...vals, ...limits.map(l => l[0])), hi = Math.max(...vals, ...limits.map(l => l[0]));
    const span = Math.max(hi - lo, o.minSpan || 1), stepv = W.niceMax(span / 2);
    vmin = Math.floor((lo - span * 0.1) / stepv) * stepv; vmax = Math.ceil((hi + span * 0.1) / stepv) * stepv;
    if (vmax - vmin < stepv * 2) vmax = vmin + stepv * 2;
  }
  if (vmax == null) vmax = W.niceMax(Math.max(vals.length ? Math.max(...vals) : 0, o.minSpan || 0) * 1.05);
  if (vmax <= vmin) vmax = vmin + 1;

  if (ph < 2 || r.w < 16) return r;
  let yticks = o.yticks;
  if (!yticks) { const n = ph >= 8 ? 5 : 3; yticks = Array.from({ length: n }, (_, i) => vmin + (vmax - vmin) * i / (n - 1)); }
  const labels = yticks.map(fmt), gw = Math.max(...labels.map(slen));
  const mkW = marker ? Math.max(0, ...series.map(([vs]) => vs.length && vs[vs.length - 1] != null ? slen(fmt(vs[vs.length - 1]) + unit) : 0)) : 0;
  const limW = Math.max(0, ...limits.map(l => l[2] ? slen(l[2]) : 0));
  const rg = (marker || limits.length) ? Math.max(mkW, limW) + 3 : 1;
  const ax = r.x + gw, px0 = ax + 1, pw = r.r - px0 - rg;
  if (pw < 4) return r;
  const yRow = v => 0.5 + (vmax - v) / (vmax - vmin) * ph;        // en lignes depuis r.y (haut = centre de la 1re ligne)
  const rowOf = v => Math.max(0, Math.min(ph, Math.round(yRow(v) - 0.5)));
  for (let i = 0; i < ph; i++) scr.put(ax, r.y + i, '│', t.L);
  yticks.forEach((v, k) => { const row = rowOf(v); scr.put(r.x, r.y + row, rjustS(labels[k], gw), t.D); if (row < ph) scr.put(ax, r.y + row, '┤', t.L); });
  const last0 = series.length ? [...series[0][0]].reverse().find(v => v != null) : null;
  const yax = r.y + ph;
  scr.put(ax, yax, '└' + '─'.repeat(pw), t.L);
  const nmax = Math.max(2, ...series.map(([vs]) => vs.length));
  const spd = o.fit ? (nmax - 1) * step / (pw * 2 - 1) : step, span = pw * 2 * spd;
  const iv = TICKS.find(s => s / (2 * spd) >= xminCells) || TICKS[TICKS.length - 1];
  let s0 = 0;
  if (o.tEnd != null) { const off = -new Date(o.tEnd * 1000).getTimezoneOffset() * 60; s0 = ((o.tEnd + off) % iv + iv) % iv; }
  for (let k = 0; s0 + k * iv <= span; k++) {
    const sec = s0 + k * iv, col = px0 + pw - 1 - Math.round(sec / (2 * spd));
    if (col < px0) break;
    scr.put(col, yax, '┴', t.L);
    const lab = xfmt(sec), lx = sec === 0 ? col - slen(lab) + 1 : col - Math.floor(slen(lab) / 2);
    if (lx >= px0 - 1) scr.put(lx, yax + 1, lab, t.F);
  }
  const limAct = limits.map(([v, , , lo]) => last0 != null && (lo === 'lo' ? last0 <= v : last0 >= v));
  limits.forEach(([v, , lab], k) => { if (lab) scr.put(px0 + pw + 1, r.y + rowOf(v), ' ' + lab, limAct[k] ? t.RR : t.RZ); });
  const used = new Set(limits.filter(l => l[2]).map(l => rowOf(l[0])));
  if (marker) series.forEach(([vs], n) => {
    if (!vs.length || vs[vs.length - 1] == null) return;
    const row0 = rowOf(vs[vs.length - 1]); let row = row0;
    outer: for (let d = 0; d < ph; d++) for (const c of [row0 + d, row0 - d]) if (c >= 0 && c < ph && !used.has(c)) { row = c; break outer; }
    used.add(row);

    const d = b.d, Y = v => b.y + yRow(v) * b.ch, x0 = b.x, x1 = b.x + b.w;

    if (grid) { c.strokeStyle = COL.K; dash(c, d, 1, 3); c.beginPath(); yticks.forEach(v => { if (v !== vmin) { const yy = Math.round(Y(v)) + 0.5; c.moveTo(x0, yy); c.lineTo(x1, yy); } }); c.stroke(); }
    limits.forEach(([v], k) => { c.strokeStyle = limAct[k] ? COL.RR : COL.RZ; dash(c, d, 4, 3); c.beginPath(); const yy = Math.round(Y(v)) + 0.5; c.moveTo(x0 - b.cw * 0.5, yy); c.lineTo(x1, yy); c.stroke(); });
    dash(c, d, 0);

      pts.forEach((v, i) => {
        if (v == null) { if (segs[segs.length - 1].length) segs.push([]); return; }
        const xx = o.fit ? x0 + (i / Math.max(1, pts.length - 1)) * b.w : x0 + (off + i + 0.5) / N * b.w;

// Histogramme avec axes : barres vectorielles à leur hauteur exacte, seuils en tirets
W.bars = (scr, r, values, o = {}) => {
  const fmt = o.fmt || (v => String(+v.toFixed(1))), vmin = o.vmin || 0, vmax = o.vmax != null ? o.vmax : 100;
  const bw = o.bw || 2, gap = o.gap != null ? o.gap : 1, labels = o.labels || [], xlab = o.xlab, now = o.now, limits = o.limits || [];
  const under = labels.length > 0 || !!xlab;

  if (ph < 2 || !values.length) return 0;

  const labs = ticks.map(fmt), gw = Math.max(...labs.map(slen)), ax = r.x + gw;
  const n = values.length, pw = Math.min(r.r - ax - 1, n * (bw + gap) + gap);
  const cur = (now != null && now < n) ? values[now] : values[n - 1];
  const yRow = v => 0.5 + (vmax - v) / (vmax - vmin) * ph, rowOf = v => Math.max(0, Math.min(ph, Math.round(yRow(v) - 0.5)));
  for (let i = 0; i < ph; i++) scr.put(ax, y0 + i, '│', t.L);
  ticks.forEach((v, k) => { const rw = rowOf(v); scr.put(r.x, y0 + rw, rjustS(labs[k], gw), t.D); if (rw < ph) scr.put(ax, y0 + rw, '┤', t.L); });
  scr.put(ax, y0 + ph, '└' + '─'.repeat(pw), t.L);
  const bars = [];
  values.forEach((v, i) => {
    const bx = ax + 1 + gap + i * (bw + gap);
    if (bx + bw > ax + 1 + pw) return;
    const st = o.styles ? o.styles[i] : ((o.alert && o.alert(v)) ? t.RR : t.N);
    if (v != null) bars.push([bx - ax - 1, bw, v, STYLES[st].fg]);
    if (labels.length && i < labels.length) { scr.put(bx, y0 + ph, '┴', t.L); scr.put(bx, y0 + ph + 1, clip(labels[i], bw + gap), t.F); }
    if (xlab && xlab[i] != null) { scr.put(bx, y0 + ph, '┴', t.L); const lab = xlab[i]; scr.put(Math.max(ax + 1, bx - Math.floor(slen(lab) / 2)), y0 + ph + 1, lab, i === now ? t.B : t.F); }
    if (i === now) { const txt = '▼ ' + (v != null ? fmt(v) : '—') + (o.unit || ''); scr.put(Math.min(bx, ax + pw - slen(txt) + 1), r.y, txt, t.B); }
  });

    c.strokeStyle = COL.K; c.lineWidth = d; dash(c, d, 1, 3); c.beginPath();
    ticks.forEach(v => { if (v !== vmin) { const yy = Math.round(Y(v)) + 0.5; c.moveTo(b.x, yy); c.lineTo(b.x + b.w, yy); } }); c.stroke(); dash(c, d, 0);
    const gapPx = gap ? 0 : Math.max(1, Math.round(b.cw * 0.12));
    for (const [cx, w, v, col] of bars) {
      const yt = Y(Math.max(vmin, Math.min(vmax, v))), xx = b.x + cx * b.cw, ww = w * b.cw - gapPx;
      const gr = c.createLinearGradient(0, yt, 0, yb); gr.addColorStop(0, col); gr.addColorStop(1, col.replace('rgb(', 'rgba(').replace(')', ',0.45)'));
      c.fillStyle = gr; c.fillRect(Math.round(xx), Math.round(yt), Math.max(1, Math.round(ww)), Math.max(0, Math.round(yb - yt)));

    dash(c, d, 0);

};

W.section = (scr, x, y, w, title, rt = '', rts = t.D) => {

// ------------------------------------------------------------------ S02 FAIL PAGE : défauts, instructions, acquittement
function wrap(text, w) {
  const out = []; let line = '';
  for (const word of String(text).split(/\s+/)) {
    if (!word) continue;
    if (line && slen(line) + 1 + slen(word) > w) { out.push(line); line = word; } else line = line ? line + ' ' + word : word;
  }
  if (line) out.push(line); return out;
}
// Sélection des défauts visés par une commande : rien = le défaut choisi, n = rang affiché, ALL, ou nom (BATT, DEP, GNSS…)
function failPick(arg) {
  const L = FAIL.list;
  if (!arg) { const e = L.find(x => x.id === FAIL.sel) || L[0]; return e ? [e] : []; }
  if (arg === 'ALL') return L.slice();
  if (/^\d+$/.test(arg)) return L[+arg - 1] ? [L[+arg - 1]] : [];
  const a = arg.replace(/[^A-Z0-9]/g, '');
  return L.filter(e => e.key.replace(/^FCU\./, '').toUpperCase() === a || e.tag === a || e.key.toUpperCase() === arg || e.msg.replace(/[^A-Z0-9]/g, '').startsWith(a));
}
function failCmdAck(app, arg) {
  const es = failPick(arg);
  if (!FAIL.list.length) return app.say('ACK · NO FAULT RECORDED');
  if (!es.length) return app.say('ACK · NO FAULT ' + arg + ' · SEE 3.2', true);
  const n = es.reduce((k, e) => k + failAck(e), 0);
  if (n) { failSave(); log('ACK', (arg === 'ALL' ? 'ACK ALL · ' : 'ACK · ') + (es.length === 1 ? es[0].msg : n + ' FAULTS')); haptic(15); }
  app.say(n ? 'ACK · ' + n + ' FAULT' + (n > 1 ? 'S' : '') + ' ACKNOWLEDGED' : 'ACK · ALREADY ACKNOWLEDGED');
}
function failCmdClear(app, arg) {
  if (!FAIL.list.length) return app.say('CLEAR · NO FAULT RECORDED');
  let es;
  if (arg === 'ALL') { es = FAIL.list.filter(e => e.tend); es.forEach(failAck); }   // CLEAR ALL : acquitte et efface tout ce qui est refermé
  else if (arg) es = failPick(arg);
  else es = FAIL.list.slice();
  if (!es.length) return app.say('CLEAR · NO FAULT ' + arg, true);
  const active = es.filter(e => !e.tend).length, unack = es.filter(e => e.tend && !e.ack).length, n = failClear(es);
  app.say(n ? 'CLEARED ' + n + (active ? ' · ' + active + ' ACTIVE KEPT' : '') + (unack ? ' · ' + unack + ' UNACK KEPT' : '')
    : (active ? 'CLEAR · FAULT STILL ACTIVE · FIX IT FIRST' : 'CLEAR · ACK FIRST (ACK ' + (arg || '') + ')'.replace(' )', ')')), !n);
}

    ['4', 'ACK ALL', app => failCmdAck(app, 'ALL'), ['ACKALL']],
    ['5', 'CLEAR', (app, arg) => failCmdClear(app, arg), ['CLEAR', 'CLR'], 'CLEAR [n|ALL]']],

    if (why.length && yy + 1 < yb) {
      scr.put(ix, yy++, 'CAUSE', t.B);
      why.forEach((l, k) => { if (yy >= yb) return; const last = yy === yb - 1 && k < why.length - 1; scr.put(ix, yy++, last ? clip(l + ' …', ir.w - 4) : l, t.D); });
    }
  } };

// Carte équirectangulaire vectorielle : terres remplies, nuit ombrée, graticule, traces de l'ISS en splines.
function splitLon(pts) { const out = [[]]; pts.forEach((p, i) => { if (i && Math.abs(p[1] - pts[i - 1][1]) > 180) out.push([]); out[out.length - 1].push(p); }); return out.filter(s => s.length > 1); }
function markSun(c, x, y, d, col) { c.strokeStyle = col; c.lineWidth = 1.3 * d; c.beginPath(); c.arc(x, y, 4.5 * d, 0, 2 * Math.PI); c.stroke(); c.fillStyle = col; c.beginPath(); c.arc(x, y, 1.4 * d, 0, 2 * Math.PI); c.fill(); }
function markMoon(c, x, y, d, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, 4.5 * d, 0.35 * Math.PI, 1.65 * Math.PI, false); c.arc(x + 2.2 * d, y, 3.6 * d, 1.62 * Math.PI, 0.38 * Math.PI, true); c.closePath(); c.fill(); }
function markIss(c, x, y, d, col) { c.fillStyle = rgba(RED, 0.25); c.beginPath(); c.arc(x, y, 7 * d, 0, 2 * Math.PI); c.fill(); c.fillStyle = col; c.fillRect(x - 3 * d, y - 3 * d, 6 * d, 6 * d); c.strokeStyle = col; c.lineWidth = 1.2 * d; c.beginPath(); c.moveTo(x - 7 * d, y); c.lineTo(x - 4 * d, y); c.moveTo(x + 4 * d, y); c.lineTo(x + 7 * d, y); c.stroke(); }
function markHome(c, x, y, d, col) { c.strokeStyle = col; c.lineWidth = 1.2 * d; c.beginPath(); c.arc(x, y, 3.5 * d, 0, 2 * Math.PI); c.moveTo(x - 7 * d, y); c.lineTo(x - 3.5 * d, y); c.moveTo(x + 3.5 * d, y); c.lineTo(x + 7 * d, y); c.moveTo(x, y - 7 * d); c.lineTo(x, y - 3.5 * d); c.moveTo(x, y + 3.5 * d); c.lineTo(x, y + 7 * d); c.stroke(); }
const LEG = (scr, x, y, items) => { for (const [g, txt, st] of items) { x += scr.put(x, y, g, st) + 1; x += scr.put(x, y, txt, t.F) + 2; } };

PAGES.S18 = { code: 'S18', name: 'TRACK', ru: 'ТРАСС', words: ['TRACK', 'ISS', 'MAP', 'ORBIT'], fps: 1, tab: 'ISS', passT: 0, pass: null,
  keys: [['1', 'ISS', () => { PAGES.S18.tab = 'ISS'; }], ['2', 'SUN', () => { PAGES.S18.tab = 'SUN'; }], ['3', 'MOON', () => { PAGES.S18.tab = 'MOON'; }]],
  draw(scr, r) {
    const T = now(), h = here(), tab = this.tab;
    const ir = W.panel(scr, r, this.code, this.name, tab + ' · TLE ' + TLE_SRC, t.TD);
    const mh = Math.max(4, Math.min(Math.round(ir.w / 2 / CELL.aspect), ir.h - 10));
    const term = A.terminator(T), iss = TLE ? A.issAt(TLE, T) : null, tr = iss ? A.issTrack(TLE, T) : null;
    const fpt = iss ? A.footprint(iss[0], iss[1], iss[2], 6) : null;
    const [sra, sdec] = A.sun(T), [mra, mdec] = A.moon(T), sp = A.subpoint(sra, sdec, T), mp = A.subpoint(mra, mdec, T);
    scr.vector(ir.x, ir.y, ir.w, mh, (c, b) => {
      const d = b.d, P = (la, lo) => [b.x + (lo + 180) / 360 * b.w, b.y + (90 - la) / 180 * b.h];
      c.strokeStyle = COL.L; c.lineWidth = d; c.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      // graticule 30°
      c.strokeStyle = COL.K; dash(c, d, 1, 3); c.beginPath();
      for (let lo = -150; lo <= 150; lo += 30) { const [x] = P(0, lo); c.moveTo(Math.round(x) + 0.5, b.y); c.lineTo(Math.round(x) + 0.5, b.y + b.h); }
      for (let la = -60; la <= 60; la += 30) { const [, y] = P(la, 0); c.moveTo(b.x, Math.round(y) + 0.5); c.lineTo(b.x + b.w, Math.round(y) + 0.5); }
      c.stroke(); dash(c, d, 0);
      // terres
      c.beginPath();
      for (const poly of LAND) { poly.forEach(([lo, la], i) => { const [x, y] = P(la, lo); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); }
      c.fillStyle = rgba(WHITE, 0.11); c.fill('evenodd'); c.strokeStyle = rgba(DIM, 0.9); c.lineWidth = d; c.lineJoin = 'round'; c.stroke();
      // nuit
      c.beginPath(); const p0 = P(term.nightPole, -180); c.moveTo(p0[0], p0[1]);
      for (const [la, lo] of term.points) { const [x, y] = P(la, lo); c.lineTo(x, y); }
      const p1 = P(term.nightPole, 180); c.lineTo(p1[0], p1[1]); c.closePath(); c.fillStyle = 'rgba(0,0,0,0.42)'; c.fill();
      c.beginPath(); W.mono(c, term.points.map(([la, lo]) => P(la, lo))); c.strokeStyle = rgba(DIM, 0.45); dash(c, d, 2, 2); c.stroke(); dash(c, d, 0);
      if (iss) {
        for (const s of splitLon(fpt)) { c.beginPath(); W.spline(c, s.map(p => P(...p))); c.strokeStyle = rgba(DIM, 0.8); dash(c, d, 3, 3); c.lineWidth = d; c.stroke(); }
        dash(c, d, 0);
        for (const s of splitLon(tr.past)) { c.beginPath(); W.spline(c, s.map(p => P(...p))); c.strokeStyle = rgba(WHITE, 0.45); dash(c, d, 1, 3); c.lineWidth = 1.4 * d; c.lineCap = 'round'; c.stroke(); }
        dash(c, d, 0);
        for (const s of splitLon(tr.future)) { c.beginPath(); W.spline(c, s.map(p => P(...p))); c.strokeStyle = tab === 'ISS' ? COL.N : COL.D; c.lineWidth = 1.5 * d; c.stroke(); }
      }
      markSun(c, ...P(...sp), d, tab === 'SUN' ? COL.RR : COL.N);
      markMoon(c, ...P(...mp), d, tab === 'MOON' ? COL.RR : COL.N);
      markHome(c, ...P(h.lat, h.lon), d, COL.N);
      if (iss) markIss(c, ...P(iss[0], iss[1]), d, tab === 'ISS' ? COL.RR : COL.N);
    });
    let y = ir.y + mh;
    LEG(scr, ir.x, y, [['■', 'ISS', tab === 'ISS' ? t.RB : t.B], ['☉', 'SUN', tab === 'SUN' ? t.RB : t.B], ['☾', 'MOON', tab === 'MOON' ? t.RB : t.B], ['⌖', h.name === 'GNSS' ? 'YOU' : h.name, t.B]]);
    W.rjust(scr, ir.r, y, hhmm(T), t.F);
    y += 2;
    const kv = (k, v, st = t.N) => { if (y < ir.b) W.kv(scr, ir.x, y++, ir.w, k, v, t.D, st); };
    if (tab === 'ISS' && iss) {
      if (T - this.passT > 60 || !this.pass || this.pass.los < T) { this.pass = A.nextPass(TLE, h.lat, h.lon, T, 24, 10, false); this.passT = T; }
      const [az, el, rng, lit] = A.issLook(TLE, T, h.lat, h.lon);
      sub(scr, ir.x, y++, ir.w, 'ISS · ZARYA', lit ? 'SUNLIT' : 'ECLIPSE');
      kv('SUBPOINT', fmtLL(iss[0], iss[1]));
      kv('ALTITUDE · VEL', Math.round(iss[2]) + ' km · 27 580 km/h');
      kv('RANGE', Math.round(A.dist(iss[0], iss[1], h.lat, h.lon)) + ' km GROUND · ' + Math.round(rng) + ' km SLANT');
      kv('AZ · EL', Math.round(az) + '° ' + card(az) + ' · ' + sgn(el, 1) + '°', el >= 10 ? t.RB : t.N);
      if (el >= 10) kv('STATUS', 'IN VIEW', t.RB);
      else if (this.pass) kv('NEXT AOS', hhmm(this.pass.aos) + ' · MAX ' + Math.round(this.pass.maxEl) + '° · ' + Math.max(1, Math.round((this.pass.los - this.pass.aos) / 60)) + ' MIN' + (this.pass.visible ? ' · VIS' : ''));
      else kv('NEXT AOS', 'NONE IN 24 h');
    } else if (tab === 'SUN') {
      const s = A.sunInfo(T, h.lat, h.lon);
      sub(scr, ir.x, y++, ir.w, 'SUN', s.day ? 'DAY' : 'NIGHT');
      kv('SUBSOLAR', fmtLL(sp[0], sp[1])); kv('AZ · EL', Math.round(s.az) + '° ' + card(s.az) + ' · ' + sgn(s.el, 1) + '°');
      kv('RISE · SET', (s.rise ? hhmm(s.rise) : '—') + ' · ' + (s.set ? hhmm(s.set) : '—')); kv('DAY LENGTH', durHM(s.length));
    } else {
      const m = A.moonInfo(T, h.lat, h.lon);
      sub(scr, ir.x, y++, ir.w, 'MOON', m.phase);
      kv('SUBLUNAR', fmtLL(mp[0], mp[1])); kv('AZ · EL', Math.round(m.az) + '° ' + card(m.az) + ' · ' + sgn(m.el, 1) + '°');
      kv('RISE · SET', (m.rise ? hhmm(m.rise) : '—') + ' · ' + (m.set ? hhmm(m.set) : '—')); kv('ILLUMINATED', Math.round(m.frac * 100) + ' % · ' + (m.waxing ? 'WAXING' : 'WANING'));
    }
  } };

// ------------------------------------------------------------------ S23 SKY
PAGES.S23 = { code: 'S23', name: 'SKY', ru: 'НЕБО', words: ['SKY', 'STARS', 'PLANETS'], fps: 6, passT: 0, pass: null,
  keys: [['1', ...K_HDG]],
  draw(scr, r) {
    this.keys[0][1] = SET.skyRot ? 'NORTH UP' : 'HDG UP';
    const T = now(), h = here(), a = aim(), rot = SET.skyRot && a ? a.hdg : 0;
    const ir = W.panel(scr, r, this.code, this.name, (SET.skyRot && a ? 'HDG UP ' : 'NORTH UP ') + Math.round(rot) + '°', t.TD);
    const rows = Math.max(6, Math.min(ir.h - 8, Math.ceil(ir.w / CELL.aspect)));
    if (T - this.passT > 120 || (this.pass && this.pass.los < T)) { this.pass = TLE ? A.nextPass(TLE, h.lat, h.lon, T, 48, 10, true) : null; this.passT = T; }
    const objs = A.skyObjects(T, h.lat, h.lon), pass = this.pass;
    const issNow = TLE ? A.issLook(TLE, T, h.lat, h.lon) : null;
    let near = null, best = 12;
    if (a) for (const o of objs) { const sep = A.dist(o.el, o.az, a.el, a.az) / 6371 * DEG; if (sep < best) { best = sep; near = o; } }
    scr.vector(ir.x, ir.y, ir.w, rows, (c, b) => {
      const d = b.d, fs = b.fpx, R = Math.min(b.w, b.h) / 2 - fs * 0.95, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const proj = (az, el) => { const rr = (90 - el) / 90 * R, aa = (az - rot) * RAD; return [cx + rr * Math.sin(aa), cy - rr * Math.cos(aa)]; };
      c.fillStyle = rgba(WHITE, 0.035); c.beginPath(); c.arc(cx, cy, R, 0, 2 * Math.PI); c.fill();
      c.strokeStyle = COL.L; c.lineWidth = 1.2 * d; c.stroke();
      c.strokeStyle = COL.K; c.lineWidth = d; dash(c, d, 1, 3);
      for (const k of [1 / 3, 2 / 3]) { c.beginPath(); c.arc(cx, cy, R * k, 0, 2 * Math.PI); c.stroke(); }
      c.beginPath(); for (let az = 0; az < 360; az += 45) { const [x, y] = proj(az, 0); c.moveTo(cx, cy); c.lineTo(x, y); } c.stroke(); dash(c, d, 0);
      // graduations d'azimut tous les 10°
      c.strokeStyle = COL.F; c.beginPath();
      for (let az = 0; az < 360; az += 10) { const [x0, y0] = proj(az, 0), [x1, y1] = proj(az, az % 30 ? 3 : 6); c.moveTo(x0, y0); c.lineTo(x1, y1); }
      c.stroke();
      c.textAlign = 'center'; c.textBaseline = 'middle';
      for (const [lab, az] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
        const rr = R + fs * 0.55, aa = (az - rot) * RAD;
        c.font = (lab === 'N' ? '700 ' : '400 ') + (fs * 0.9).toFixed(1) + 'px ' + b.family; c.fillStyle = lab === 'N' ? COL.N : COL.D;
        c.fillText(lab, cx + rr * Math.sin(aa), cy - rr * Math.cos(aa));
      }
      c.font = '400 ' + (fs * 0.62).toFixed(1) + 'px ' + b.family;
      for (const lab of ['30', '60']) { const [x, y] = proj(rot + 135, +lab); c.fillStyle = COL.F; c.fillText(lab + '°', x, y); }
      if (pass) {
        const pts = pass.track.map(([az, el]) => proj(az, el));
        c.beginPath(); W.spline(c, pts); c.strokeStyle = COL.RR; c.lineWidth = 1.4 * d; dash(c, d, 4, 3); c.stroke(); dash(c, d, 0);
        if (pts.length > 1) { const [x0, y0] = pts[0]; c.fillStyle = COL.RR; c.beginPath(); c.arc(x0, y0, 2.2 * d, 0, 2 * Math.PI); c.fill(); c.fillText('AOS', x0, y0 - fs * 0.6); }
      }
      for (const o of objs.slice().reverse()) {
        const [x, y] = proj(o.az, o.el), hot = near === o;
        if (o.kind === 'star') { c.fillStyle = hot ? COL.N : COL.D; c.beginPath(); c.arc(x, y, (hot ? 1.8 : 1.2) * d, 0, 2 * Math.PI); c.fill(); continue; }
        if (o.kind === 'moon') markMoon(c, x, y, d, COL.N);
        else if (o.kind === 'sun') markSun(c, x, y, d, COL.N);
        else { c.fillStyle = COL.N; c.beginPath(); c.moveTo(x, y - 3.5 * d); c.lineTo(x + 3.5 * d, y); c.lineTo(x, y + 3.5 * d); c.lineTo(x - 3.5 * d, y); c.closePath(); c.fill(); }
        c.fillStyle = hot ? COL.N : COL.D; c.textAlign = 'left'; c.fillText(o.name.slice(0, 3), x + 6 * d, y); c.textAlign = 'center';
      }
      if (issNow && issNow[1] > 0) markIss(c, ...proj(issNow[0], issNow[1]), d, COL.RR);
      if (a && a.el > -5) {
        const [x, y] = proj(a.az, Math.max(0, a.el));
        c.strokeStyle = COL.RR; c.lineWidth = 1.4 * d; c.beginPath(); c.arc(x, y, 8 * d, 0, 2 * Math.PI);
        c.moveTo(x - 13 * d, y); c.lineTo(x - 4 * d, y); c.moveTo(x + 4 * d, y); c.lineTo(x + 13 * d, y); c.moveTo(x, y - 13 * d); c.lineTo(x, y - 4 * d); c.moveTo(x, y + 4 * d); c.lineTo(x, y + 13 * d); c.stroke();
      }
    });
    let y = ir.y + rows + 1;
    const kv = (k, v, st = t.N) => { if (y < ir.b) W.kv(scr, ir.x, y++, ir.w, k, v, t.D, st); };
    if (a) kv('AIM ' + tag('orient'), Math.round(a.az) + '° ' + card(a.az) + ' · EL ' + sgn(a.el, 0) + '°' + (near ? ' ▸ ' + near.name : ''), near ? t.B : t.N);

// ------------------------------------------------------------------ cadran du ciel commun (SATS, RELAYS)
function skyDial(c, b, rot, mask) {
  const d = b.d, fs = b.fpx, R = Math.min(b.w, b.h) / 2 - fs * 0.95, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const proj = (az, el) => { const rr = (90 - Math.max(0, el)) / 90 * R, aa = (az - rot) * RAD; return [cx + rr * Math.sin(aa), cy - rr * Math.cos(aa)]; };
  c.fillStyle = rgba(WHITE, 0.035); c.beginPath(); c.arc(cx, cy, R, 0, 2 * Math.PI); c.fill();
  c.strokeStyle = COL.L; c.lineWidth = 1.2 * d; c.stroke();
  c.strokeStyle = COL.K; c.lineWidth = d; dash(c, d, 1, 3);
  for (const k of [1 / 3, 2 / 3]) { c.beginPath(); c.arc(cx, cy, R * k, 0, 2 * Math.PI); c.stroke(); }
  c.beginPath(); for (let az = 0; az < 360; az += 45) { const [x, y] = proj(az, 0); c.moveTo(cx, cy); c.lineTo(x, y); } c.stroke();
  if (mask) { c.strokeStyle = COL.RZ; dash(c, d, 2, 3); c.beginPath(); c.arc(cx, cy, R * (90 - mask) / 90, 0, 2 * Math.PI); c.stroke(); }
  dash(c, d, 0);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [lab, az] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
    const rr = R + fs * 0.55, aa = (az - rot) * RAD;
    c.font = (lab === 'N' ? '700 ' : '400 ') + (fs * 0.9).toFixed(1) + 'px ' + b.family; c.fillStyle = lab === 'N' ? COL.N : COL.D;
    c.fillText(lab, cx + rr * Math.sin(aa), cy - rr * Math.cos(aa));
  }
  c.font = '400 ' + (fs * 0.56).toFixed(1) + 'px ' + b.family;
  return { proj, R, cx, cy, d, fs };
}
// symboles : G cercle, E losange, R triangle, C carré, relais : ▲ Iridium, · OneWeb, ◆ amateur, ■ TDRS, | GEO
function satGlyph(c, k, x, y, s, fill, col) {
  c.fillStyle = col; c.strokeStyle = col; c.lineWidth = Math.max(1, s * 0.35);
  c.beginPath();
  if (k === 'G' || k === 'O') c.arc(x, y, s, 0, 2 * Math.PI);
  else if (k === 'E' || k === 'A') { c.moveTo(x, y - s * 1.25); c.lineTo(x + s * 1.25, y); c.lineTo(x, y + s * 1.25); c.lineTo(x - s * 1.25, y); c.closePath(); }
  else if (k === 'R' || k === 'I') { c.moveTo(x, y - s * 1.2); c.lineTo(x + s * 1.1, y + s * 0.8); c.lineTo(x - s * 1.1, y + s * 0.8); c.closePath(); }
  else if (k === 'Q') { c.moveTo(x, y - s * 1.3); c.lineTo(x, y + s * 1.3); c.stroke(); return; }
  else c.rect(x - s, y - s, 2 * s, 2 * s);
  if (fill) c.fill(); else c.stroke();
}

  let ok = 0, miss = 0, fail = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const k = (la + dy) + '_' + (lo + dx);

      if (r.status === 404) { CELLS.tiles[k] = []; miss++; continue; }

}

  const out = [], ops = ['ORANGE', 'SFR', 'BOUYGUES TELECOM', 'FREE MOBILE'];
  for (let i = 0; i < 16; i++) {
    const a = (i * 137.5) * RAD, dist = 180 + (i * 233) % 2400;
    const dla = dist * Math.cos(a) / 111320, dlo = dist * Math.sin(a) / (111320 * Math.cos(lat * RAD));

}

const OP_GLYPH = { 'ORANGE': 'G', 'SFR': 'R', 'BOUYGUES TELECOM': 'C', 'FREE MOBILE': 'E' };   // formes de satGlyph

function towersNear(lat, lon, radius = 3000) {
  const list = CELLS.sim ? simTowers(lat, lon) : Object.values(CELLS.tiles).flat();
  const out = [];
  for (const s of list) {
    const [la, lo, op, gen, h, az, sys, id] = s;
    const dist = A.dist(lat, lon, la, lo) * 1000;
    if (dist > radius) continue;
    const brg = bearing(lat, lon, la, lo), back = A.norm360(brg + 180);
    const azs = String(az || '').split('|').filter(Boolean).map(Number);
    let sector = null, best = 61;
    for (const a of azs) { const dd = Math.abs(A.norm180(back - a)); if (dd < best) { best = dd; sector = a; } }
    const opName = CELLS.ops[op] || String(op);
    out.push({ la, lo, op: opName, gen, h, azs, sys, id, dist, brg, sector, off: sector == null ? null : best });
  }
  return out.sort((a, b) => a.dist - b.dist);

function button(scr, x, y, w, h, head, tail, fn, o = {}) {
  const on = !!o.on, dead = !!o.dead;
  scr.vector(x, y, w, h, (c, b) => {
    const d = b.d, ins = 2 * d, X = Math.round(b.x + ins), Y = Math.round(b.y + ins), Wb = Math.round(b.w - 2 * ins), Hb = Math.round(b.h - 2 * ins);
    c.fillStyle = on ? COL.N : (o.red ? COL.RR : (dead ? '#0d1012' : '#1b1f23')); c.fillRect(X, Y, Wb, Hb);
    if (!on) { c.strokeStyle = dead ? COL.K : COL.L; c.lineWidth = d; c.strokeRect(X + 0.5 * d, Y + 0.5 * d, Wb - d, Hb - d); }
    const fg = on ? 'rgb(' + INK.join(',') + ')' : (dead ? COL.F : COL.N), fg2 = on ? 'rgba(' + INK.join(',') + ',0.7)' : (dead ? COL.F : COL.D);
    const fs = b.fpx * (o.small ? 0.78 : 1);
    c.textBaseline = 'middle';
    if (tail && Hb > fs * 2.1) {
      c.textAlign = 'center';
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; c.fillStyle = fg; c.fillText(head, X + Wb / 2, Y + Hb * 0.38);
      c.font = '400 ' + (fs * 0.72).toFixed(1) + 'px ' + b.family; c.fillStyle = fg2; c.fillText(tail, X + Wb / 2, Y + Hb * 0.74);
    } else {
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; const w1 = c.measureText(head).width;
      c.font = '400 ' + (fs * 0.8).toFixed(1) + 'px ' + b.family; const w2 = tail ? c.measureText(' ' + tail).width : 0;
      let tx = X + (Wb - w1 - w2) / 2; c.textAlign = 'left';
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; c.fillStyle = fg; c.fillText(head, tx, Y + Hb / 2 + 0.5 * d);

    }

  if (fn && !dead) app_hit(x, y, w, h, () => { haptic(8); fn(); });
}

class App {

    const n = GROUPS[this.gi][3].length;
    this.pi[this.gi] = pi == null ? 0 : ((pi % n) + n) % n;          // changement de groupe : retour au format .1
    if (this.gi !== cur[0] || this.pi[this.gi] !== cur[1]) this.prev = cur;
    this.helpOv = null;
  }
  step(dd) { this.show(this.gi, this.pi[this.gi] + dd); }          // sous-section suivante / précédente du groupe

  address() { return (this.gi + 1) + '.' + (this.pi[this.gi] + 1); }
  blink() { return Math.floor(Date.now() / 500) % 2 === 0; }      // annonciateur CRITICAL : 1 Hz

  lamp() {
    if (!this.lampT0) return null;

    if (k >= 13) { this.lampT0 = 0; return null; }

    return { ann: k < 4 ? 1 : (k < 8 ? 2 : 0), lit: (k % 2 === 1 && k <= 11) ? ORD[(k + 1) / 2 - 1] : null, k };
  }
  find(word) {
    const wd = String(word).trim().toUpperCase(); if (!wd) return null;
    const m = wd.match(/^(\d)\.(\d)$/);
    if (m) { const g = +m[1] - 1, f = +m[2] - 1; if (GROUPS[g] && GROUPS[g][3][f]) return [g, f]; }
    for (let gi = 0; gi < GROUPS.length; gi++) for (let pi = 0; pi < GROUPS[gi][3].length; pi++) {
      const code = GROUPS[gi][3][pi], p = PAGES[code];
      if (code === wd || code.slice(1) === wd.replace(/^[SM]/, '').padStart(2, '0') && /^[SM]?\d+$/.test(wd) && (wd[0] === code[0] || /^\d/.test(wd))) return [gi, pi];
      if ([p.name.replace(' · ', ' ')].concat(p.words).some(n => n === wd || n.startsWith(wd) || n.split(' ')[0] === wd)) return [gi, pi];
    }

  }
  say(text, warn = false) { this.msg = text; this.msgT = now(); this.msgWarn = warn; this.msgN = (this.msgN || 0) + 1; }
  // ---------------------------------------------------------- commandes : une seule grammaire pour tous les formats
  //   <FORMAT>                  2.3 · S19 · M08 · WEATHER                    navigation
  //   *n                        action n du format affiché (comme * puis n au pavé)
  //   <ACTION> [ARG]            ACK 2 · SIM ON · HDG OFF                     format affiché, sinon groupe, sinon Grafit
  //   <FORMAT> <ACTION|n> [ARG] FAIL ACK ALL · WX REFRESH · S29 3            action d'un autre format, qui s'affiche
  //   HELP [FORMAT|ALL]
  // Une action d'un autre format s'exécute si elle est unique (ou si toutes ses occurrences font la même chose).
  static norm(x) { return String(x).toUpperCase().replace(/−/g, '-').replace(/[^A-Z0-9+\-]/g, ''); }
  acts(p) {
    return (p.keys || []).map(k => ({ p, k: k[0], lab: k[1], fn: k[2], words: (k[3] || [k[1]]).map(App.norm), syn: k[4] || null }))
      .concat((p.cmds || []).map(c => ({ p, k: null, lab: c[0][0], fn: c[1], words: c[0].map(App.norm), syn: c[2] || null })));
  }
  matchAct(p, toks) {                                   // plus long préfixe de mots d'abord : ACK ALL avant ACK + ALL
    const acts = this.acts(p);
    for (let i = toks.length; i >= 1; i--) {
      const w = App.norm(toks.slice(0, i).join(''));
      const a = w && acts.find(x => x.words.includes(w));

    const wd = String(word).toUpperCase();
    const m = wd.match(/^(\d)\.(\d{1,2})$/);
    if (m) { const g = +m[1] - 1, f = +m[2] - 1; return GROUPS[g] && GROUPS[g][3][f] ? [g, f] : null; }
    for (let gi = 0; gi < GROUPS.length; gi++) for (let pi = 0; pi < GROUPS[gi][3].length; pi++) {
      const code = GROUPS[gi][3][pi], p = PAGES[code];
      if (code === wd || [p.name.replace(' · ', ' ').replace(/ /g, '')].concat(p.words.map(x => x.replace(/ /g, ''))).includes(wd)) return [gi, pi];

        ['COMMON', ''], ['ACK [n|ALL]', 'ACKNOWLEDGE FAULTS'], ['CLEAR [n|ALL]', "ERASE ACK'D ENDED FAULTS"], ['SEL [n|+|-]', 'SELECT ITEM'],
        ['LAMP', 'LAMP TEST'], ['REFRESH', 'RELOAD FEED OF THE GROUP'], ['SIM AUTO|ON|OFF', 'SIMULATION'], ['WAKE · HDG', '[ON|OFF] TOGGLES'],

      let n = +p; const pages = GROUPS[this.gi][3];
      if (pend === '.') { n = n || 10; if (n <= pages.length) this.show(this.gi, n - 1); else this.say('NO FORMAT ' + (this.gi + 1) + '.' + n + ' · GROUP ' + (this.gi + 1) + ' HAS ' + pages.length, true); }
      else if (pend === '*') { if (!this.action(p)) this.say('NO ACTION ' + p + ' ON ' + this.page.code + ' ' + this.page.name, true); }
      else if (n === 0) { if (this.prev) this.show(...this.prev); }
      else if (n <= GROUPS.length) this.show(n - 1);
      else this.say('NO GROUP ' + n + ' · GROUPS 1-' + GROUPS.length, true);
    } else if (p === '.' || p === '*') { this.pad = p; this.padT = now() + 4; }
    else if (p === '+' || p === '-') this.step(p === '+' ? 1 : -1);
    else if (p === '/') this.lampTest();
  }
  action(k, arg = '') { const a = (this.page.keys || []).find(x => x[0] === k); if (!a) return false; this.helpOv = null; a[2](this, arg, ''); return true; }
  onKey(e) {
    if (!this.ready) { if (now() - this.splash >= 2.2) this.start(); return; }
    const k = e.key, code = e.code || '';
    if (this.cmd !== null) return;                        // la saisie va dans le champ de commande
    if (code.startsWith('Numpad') || code === 'NumLock') { e.preventDefault(); const m = { NumLock: 'ESC', NumpadEnter: 'ENTER', NumpadDecimal: '.', NumpadMultiply: '*', NumpadAdd: '+', NumpadSubtract: '-', NumpadDivide: '/' }; return this.onPad(m[code] || code.slice(6)); }
    if (/^F[1-7]$/.test(k)) { e.preventDefault(); return this.show(+k.slice(1) - 1); }
    if (k === 'ArrowLeft') return this.step(-1);
    if (k === 'ArrowRight') return this.step(1);
    if (k === 'ArrowUp') return this.show(this.gi - 1);
    if (k === 'ArrowDown') return this.show(this.gi + 1);
    if (k === 'Escape') return this.onPad('ESC');
    if (k === 'Enter' || k === ':') { e.preventDefault(); return openCmd(); }
    if (k === '/') return this.lampTest();
    if (/^[1-9]$/.test(k)) { if (!this.action(k)) { const n = +k - 1; if (n < GROUPS[this.gi][3].length) this.show(this.gi, n); } return; }
    if (/^[a-z]$/i.test(k) && !e.ctrlKey && !e.metaKey) { openCmd(k); e.preventDefault(); }
  }
  start() { if (this.ready) return; this.ready = true; armSensorsGesture(); haptic(20); log('SYS', 'CONSOLE START · 1.1 OVERVIEW'); }
  // ---------------------------------------------------------- dessin
  draw(scr) {
    this.hits = [];
    scr.clear();
    const Wd = scr.w, H = scr.h, blink = this.blink();
    if (!this.ready) return this.drawSplash(scr);
    this.drawBand(scr, Wd, blink);
    const CONS = 18;                                  // pupitre : onglets (7) + espace (1) + pavé (10)
    let r;
    if (Wd >= 80 && H < CONS + 12) {                  // paysage : pupitre à droite
      const cw = Math.min(36, Math.floor(Wd * 0.4)), y0 = Math.max(3, H - 1 - CONS);
      r = new Rect(0, 3, Wd - cw - 1, H - 4); this.drawConsole(scr, Wd - cw, y0, cw);
    } else {
      const y0 = H - 1 - CONS;
      r = new Rect(0, 3, Wd, y0 - 3); this.drawConsole(scr, 0, y0, Wd);
    }
    const page = this.page;
    if (this.helpOv && now() - this.helpOv.t > 45) this.helpOv = null;
    try { if (this.helpOv) this.drawHelp(scr, r); else page.draw(scr, r, this); }
    catch (err) { const ir = W.panel(scr, r, page.code, page.name, 'FAULT', t.TR, true); scr.put(ir.x, ir.y + 1, clip('FORMAT FAULT · ' + err.message, ir.w), t.R); console.error(err); }
    this.drawCmd(scr, H - 1, Wd, blink);
  }
  drawSplash(scr) {
    const el = now() - this.splash, Wd = scr.w, cx = Math.floor(Wd / 2);
    const lr = Math.max(6, Math.min(Math.floor(scr.h * 0.3), Math.round(Wd * 0.5 / CELL.aspect)));
    const y0 = Math.max(1, Math.floor((scr.h - lr - 18) / 2));
    // logo : contour blanc, puis « survol » (rotation 45° des lames, remplissage rouge délavé) en 0,9 s
    const k = Math.max(0, Math.min(1, (el - 0.5) / 0.9)), e = k * k * (3 - 2 * k);
    scr.vector(0, y0, Wd, lr, (c, b) => {
      const size = Math.min(b.w, b.h) * 0.92, X = b.x + b.w / 2, Y = b.y + b.h / 2;
      if (e < 1) drawLogo(c, X, Y, size, b.d, { stroke: rgba(WHITE, 1 - e), rot: 45 * e, lw: 1.4 });
      if (e > 0) drawLogo(c, X, Y, size, b.d, { fill: rgba(RED, e), rot: 45 * e });
    });
    let y = y0 + lr + 1;
    scr.vector(0, y, Wd, 3, (c, b) => {
      const fs = b.fpx * 2.3; c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; c.fillStyle = COL.N; c.textAlign = 'center'; c.textBaseline = 'middle';
      try { c.letterSpacing = (fs * 0.18).toFixed(1) + 'px'; } catch (e) { /* */ }
      c.fillText(CFG.OS_RU, b.x + b.w / 2 + fs * 0.09, b.y + b.h / 2);
    }, false);
    y += 3;
    scr.put(0, y++, center('ORBITAL VKL · ' + CFG.STATION + ' · ' + CFG.VERSION, Wd), t.D);
    y++;
    const checks = [['ORIENT', 'orient'], ['MOTION', 'motion'], ['GNSS', 'geo'], ['BATTERY', 'batt'], ['NETWORK', 'net'], ['BAROMETER', 'baro'], ['WEATHER', 'wx'], ['FCU 0.4.1', null]];
    checks.forEach(([n, kk], i) => {
      if (el < 0.4 + i * 0.18) return;
      const st = kk ? tag(kk) : 'ONLINE', w = Math.min(32, Wd - 4), x = cx - Math.floor(w / 2);
      W.kv(scr, x, y + i, w, n, st, t.D, st === 'LIVE' || st === 'ONLINE' ? t.B : (st === 'SIM' ? t.INVN : t.F));
    });
    y += checks.length + 1;
    if (el < 2.2) { scr.put(0, y, center('LOADING …', Wd), t.F); return; }
    const on = Math.floor(Date.now() / 600) % 2 === 0, msg = ' ▸ TAP TO START ';
    scr.put(cx - Math.floor(slen(msg) / 2), y, msg, on ? t.INV : t.B);
    this.hits.push({ x: 0, y: 0, w: scr.w, h: scr.h, fn: () => this.start() });
  }
  // bandeau : logo Orbital VKL, ГРАФИТ, heure, ВКЛ ● ; MET, état des alarmes, SIM (affichage seulement)
  drawBand(scr, Wd, blink) {
    scr.fill(0, 0, Wd, 2, ' ', t.T);
    const fs = failStats(), crit = ALS.crit > 0 && fs.ucrit > 0;
    scr.vector(0, 0, 5, 2, (c, b) => {
      const size = Math.min(b.h, b.w) * 0.94;
      drawLogo(c, b.x + b.w / 2, b.y + b.h / 2, size, b.d, { fill: crit && !blink ? COL.R : COL.RR });
    });
    let x = 6;
    x += scr.put(x, 0, CFG.OS_RU, t.T) + 1;
    scr.put(x, 0, 'v' + CFG.VERSION + ' · ' + CFG.BUILD, t.TD);
    const right = new Date().toTimeString().slice(0, 8) + ' ВКЛ ';
    W.rjust(scr, Wd - 2, 0, right, t.T); scr.put(Wd - 2, 0, '●', t.TR);
    const up = now() - this.t0, d = Math.floor(up / 86400), rest = up % 86400;
    scr.put(6, 1, 'MET T+' + d + 'd ' + pad2(rest / 3600) + ':' + pad2(rest % 3600 / 60) + ':' + pad2(rest % 60), t.TD);
    const sim = SOURCES.some(([k]) => SRC[k].mode === 'sim');
    let xr = Wd - 1;
    if (sim) { xr -= 5; scr.put(xr, 1, ' SIM ', t.INVN); xr -= 1; }
    let st, txt;
    if (ALS.crit) { txt = ' MASTER CAUTION · ' + ALS.crit + ' CRIT '; st = blink && fs.ucrit ? t.ALERT : t.TR; }
    else if (ALS.caut) { txt = ' CAUTION · ' + ALS.caut + ' '; st = t.TR; }
    else if (fs.ucrit || fs.ucaut) { const n = fs.ucrit + fs.ucaut; txt = ' ' + n + ' UNACK · 3.2 '; st = t.TR; }
    else { txt = 'NOMINAL '; st = t.TF; }
    W.rjust(scr, xr, 1, txt, st);
    scr.put(0, 2, '─'.repeat(Wd), t.L);
  }
  // pupitre : onglets d'affichage (groupes, formats du groupe) entourés des flèches ◀ ▶, espace, pavé de touches
  drawConsole(scr, x0, y0, Wd) {
    const SHORT = { STATUS: 'STAT', SYSTEMS: 'SYST', ALARMS: 'ALRM', COMMS: 'COMM' };
    const codes = GROUPS[this.gi][3], ng = GROUPS.length, nf = codes.length, AW = 5;
    const bx = (i, n, a, b) => a + Math.round(i * (b - a) / n);
    const boxes = [];                                   // onglets : [xa, ya, xb, yb, id]
    GROUPS.forEach((g, i) => boxes.push([bx(i, ng, 0, Wd - 1), 0, bx(i + 1, ng, 0, Wd - 1), 3, 'g' + i]));
    codes.forEach((c, i) => boxes.push([bx(i, nf, AW, Wd - 1 - AW), 3, bx(i + 1, nf, AW, Wd - 1 - AW), 6, 'f' + i]));
    const mask = new Map(), add = (x, y, b) => { const k = x + ',' + y; mask.set(k, (mask.get(k) || 0) | b); };
    for (const [xa, ya, xb, yb] of boxes) {
      for (let x = xa; x < xb; x++) { add(x, ya, 2); add(x + 1, ya, 8); add(x, yb, 2); add(x + 1, yb, 8); }
      for (let y = ya; y < yb; y++) { add(xa, y, 4); add(xa, y + 1, 1); add(xb, y, 4); add(xb, y + 1, 1); }
    }
    const CH = { 3: '└', 5: '│', 6: '┌', 7: '├', 9: '┘', 10: '─', 11: '┴', 12: '┐', 13: '┤', 14: '┬', 15: '┼', 1: '│', 2: '─', 4: '│', 8: '─' };
    for (const [key, b] of mask) { const [x, y] = key.split(',').map(Number); scr.put(x0 + x, y0 + y, CH[b] || ' ', t.F); }
    for (const [xa, ya, xb, yb, id] of boxes) {
      const kx = x0 + xa + 1, kw = xb - xa - 1, ky = y0 + ya + 1, kh = yb - ya - 1;
      const i = +id.slice(1), isG = id[0] === 'g', on = isG ? i === this.gi : i === this.pi[this.gi];
      const lines = isG ? [GROUPS[i][0], SHORT[GROUPS[i][1]] || GROUPS[i][1]] : ['.' + (i + 1) + ' ' + codes[i], PAGES[codes[i]].name.replace(' · ', '·')];
      lines.forEach((s, j) => scr.put(kx, ky + j, center(clip(s, kw), kw), on ? (j ? t.N : t.B) : (j ? t.F : t.D)));
      if (on) { scr.put(kx, ky + kh, '━'.repeat(kw), t.N); }       // onglet actif : trait gras dessous
    }
    // flèches latérales : sous-section précédente / suivante
    button(scr, x0, y0 + 4, AW, 2, '◀', '', () => this.step(-1), { small: false });
    button(scr, x0 + Wd - AW, y0 + 4, AW, 2, '▶', '', () => this.step(1), { small: false });
    // pavé : ESC / * ↵ · 7 8 9 + · 4 5 6 · 1 2 3 − · 0 .
    const KEYS = { ESC: [0, 0, 1, 1], '/': [1, 0, 1, 1], '*': [2, 0, 1, 1], ENTER: [3, 0, 1, 1],
      '7': [0, 1, 1, 1], '8': [1, 1, 1, 1], '9': [2, 1, 1, 1], '+': [3, 1, 1, 2],
      '4': [0, 2, 1, 1], '5': [1, 2, 1, 1], '6': [2, 2, 1, 1],
      '1': [0, 3, 1, 1], '2': [1, 3, 1, 1], '3': [2, 3, 1, 1], '-': [3, 3, 1, 2],
      '0': [0, 4, 2, 1], '.': [2, 4, 1, 1] };
    const SHOW = { '-': '−', ENTER: '↵' };
    const lab = { ESC: '', '/': 'TEST', '*': 'ACT', '-': 'PREV', '+': 'NEXT', ENTER: 'CMD', '0': 'RCL', '.': 'FMT' };
    GROUPS.forEach(([k, n]) => { lab[k] = SHORT[n] || n; });
    const pend = now() < this.padT ? this.pad : null, py = y0 + 8;
    for (const [k, [c, rr, cs, rs]] of Object.entries(KEYS)) {
      const xa = bx(c, 4, 0, Wd), xb = bx(c + cs, 4, 0, Wd);
      const on = k === String(this.gi + 1) || k === pend || (k === '/' && !!this.lampT0);
      const dead = /^[89]$/.test(k) && +k > ng;
      button(scr, x0 + xa, py + rr * 2, xb - xa, rs * 2, SHOW[k] || k, lab[k], () => this.onPad(k), { on, dead, small: k === 'ENTER' });
    }
  }
  drawCmd(scr, y, Wd, blink) {
    let x = scr.put(0, y, ' ' + CFG.STATION.slice(0, 3) + ' ▸ ', t.B);
    if (this.cmd !== null) {
      x += scr.put(x, y, this.cmd.slice(-(Wd - 20)), t.N); scr.put(x, y, blink ? '█' : ' ', t.N);
      W.rjust(scr, Wd - 1, y, '↵ RUN · ESC', t.F); return;
    }
    const pend = now() < this.padT ? this.pad : null;
    if (pend === '.') { x += scr.put(x, y, 'ФОРМАТ ' + (this.gi + 1) + '.', t.B); scr.put(x, y, blink ? '█' : ' ', t.N); return; }
    if (pend === '*') { x += scr.put(x, y, 'ДЕЙСТВИЕ · ' + this.page.code + ' ', t.B); scr.put(x, y, blink ? '█' : ' ', t.N); return; }
    if (now() - this.msgT < 6 && this.msg) { scr.put(x, y, clip(this.msg, Wd - x - 1), this.msgWarn ? t.RB : t.N); return; }
    const keys = this.page.keys || [];
    if (this.page.padKeys === false) { scr.put(x, y, clip('↵ ' + keys.map(k => (k[4] || k[1])).join(' · ') + ' · HELP', Wd - x - 1), t.D); return; }
    if (!keys.length) { scr.put(x, y, clip('↵ COMMAND · TYPE HELP', Wd - x - 1), t.D); return; }
    for (const [k, labl, fn] of keys) {                // actions du format : petites touches
      const w = slen(labl) + 5; if (x + w > Wd) break;
      button(scr, x, y, w, 1, '*' + k, labl, () => fn(this), { small: true });
      x += w + 1;
    }
  }
}

// ---------------------------------------------------------------------------------------- saisie, gestes
const CMD_IN = document.getElementById('cmd');
function openCmd(first = '') { APP.cmd = first; CMD_IN.value = first; try { CMD_IN.focus({ preventScroll: true }); } catch (e) { CMD_IN.focus(); } }
CMD_IN.addEventListener('input', () => { if (APP.cmd !== null) APP.cmd = CMD_IN.value; });
CMD_IN.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const l = APP.cmd || ''; APP.cmd = null; CMD_IN.blur(); APP.execute(l); }
  else if (e.key === 'Escape') { APP.cmd = null; CMD_IN.blur(); }
});
CMD_IN.addEventListener('blur', () => { if (APP.cmd === '') APP.cmd = null; });

function toggleFull() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => APP.say('FULLSCREEN REFUSED', true)); }
  catch (e) { APP.say('FULLSCREEN UNAVAILABLE', true); }
}
function zoom(d) { SET.scale = Math.max(0.7, Math.min(1.5, +(SET.scale + d * 0.1).toFixed(2))); saveSettings(); relayout(); }
function simReset() { SOURCES.forEach(([k]) => { const s = SRC[k]; if (k === 'mic' && !MIC) { s.mode = SET.sim === 'ON' ? 'sim' : 'off'; return; } if (s.mode === 'sim' || s.mode === 'na') { s.mode = 'wait'; s.armed = now(); } }); if (SET.sim !== 'ON' && TREND_SRC === 'SIM') resetTrend('SIM OFF'); }

const CV = document.getElementById('scr');
const R = new Renderer(CV);
let SCR = new Screen(46, 40);
function relayout() { const [w, h] = R.layout(); SCR = new Screen(w, h); }
function cellAt(ev) { const rect = CV.getBoundingClientRect(); return [Math.floor((ev.clientX - rect.left) / R.cw), Math.floor((ev.clientY - rect.top) / R.ch)]; }
let TOUCH = null;
CV.addEventListener('pointerdown', ev => { TOUCH = { x: ev.clientX, y: ev.clientY, t: now() }; armSensorsGesture(); });
CV.addEventListener('pointerup', ev => {
  if (!TOUCH) return;
  const dx = ev.clientX - TOUCH.x, dy = ev.clientY - TOUCH.y; TOUCH = null;
  if (APP.ready && Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { APP.step(dx < 0 ? 1 : -1); haptic(6); frame(true); return; }
  if (Math.hypot(dx, dy) > 16) return;
  const [x, y] = cellAt(ev);
  for (let i = APP.hits.length - 1; i >= 0; i--) { const h = APP.hits[i]; if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { h.fn(APP); frame(true); return; } }
});
window.addEventListener('keydown', e => { if (e.target === CMD_IN) return; APP.onKey(e); frame(true); });
window.addEventListener('resize', () => { relayout(); frame(true); });

// ---------------------------------------------------------------------------------------- boucles
let nextFrame = 0;
function frame(force = false) {
  const tt = now(), fps = APP.lampT0 ? 10 : (APP.page.fps || 2);
  if (!force && tt < nextFrame) return;
  nextFrame = tt + 1 / fps;
  APP.draw(SCR); R.draw(SCR);
}
function fastTick() {                                   // 10 Hz : capteurs rapides
  micPoll(); simTick(); gravityUp();
  const g = gLoad(), T = now();
  if (g != null) { HIST.g.push(g); if (g > (T - DER.gPeakT < AL.GLatchSecs ? DER.gPeak : 0)) { DER.gPeak = g; DER.gPeakT = T; } }
  if (live('mic')) HIST.mic.push(SRC.mic.v.db);
  chrTick();
}
function slowTick() {                                   // 1 Hz : alarmes, FCU, historiques
  alarmsTick(); trendTick();
  if (live('batt')) HIST.batt.push(SRC.batt.v.level * 100);
  if (live('net') && SRC.net.v.online) HIST.rtt.push(SRC.net.v.rtt);
  if (live('geo')) HIST.acc.push(SRC.geo.v.acc);
  const T = now();
  if (T - WX.tryT > (WX.failed ? 300 : 900) && (SRC.wx.mode !== 'sim' || SET.sim === 'AUTO') && SET.sim !== 'ON') fetchWx();
  rainWatch();
}

function boot() {
  loadSettings(); restoreTrend(); failRestore();
  APP = new App();
  log('SYS', CFG.OS_RU + ' ' + CFG.VERSION + ' ONLINE · ' + CFG.STATION);
  R.measure(); relayout();
  startSensors();
  if (SET.wake) wakeSet(true);
  setInterval(fastTick, 100); setInterval(slowTick, 1000);
  setTimeout(fetchWx, 1500); setTimeout(fetchTle, 2500); setTimeout(fetchSatCat, 3500); setInterval(() => fetchSatCat(), 6 * 3600 * 1000); setInterval(fetchTle, 6 * 3600 * 1000);
  // rendu : requestAnimationFrame quand le navigateur le fournit, plus une minuterie de secours
  // (certains cadres intégrés suspendent requestAnimationFrame jusqu'au premier geste)
  const loop = () => { frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(() => frame(), 50);
  setTimeout(() => frame(true), 2300);
  if (document.fonts && document.fonts.load) document.fonts.load('400 16px "Martian Mono"').then(() => { R.measure(); relayout(); frame(true); }).catch(() => {});
}
boot();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
