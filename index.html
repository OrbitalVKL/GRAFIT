<style>
/* Console plein écran : grille de caractères dessinée sur un canvas. Look unique, sombre, par choix (terminal Soyuz). */
:root { --bg: #0a0c0e; --fg: #cfd2d4; --dim: #82868a; --red: #9e4a4a; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* marge basse : les coins arrondis de l'écran (Pixel) ne sont pas couverts par les zones sûres */
#wrap { position: fixed; top: env(safe-area-inset-top, 0px); bottom: max(env(safe-area-inset-bottom, 0px), 26px); left: 16px; right: 16px; }

<noscript>Grafit Mobile needs JavaScript.</noscript>
<script>
'use strict';
/* =====================================================================================================
   ГРАФИТ · GRAFIT OS MOBILE — noyau sans DOM : thème, tampon d'écran, composants Soyuz, éphémérides,
   tendance barométrique (ДЕП). Ports de grafit/theme.py, screen.py, widgets.py, astro.py et de
   Scripts/lib/pressure_trend.lua (PK8-S16A fw 0.4.1). Même logique, mêmes unités.
   ===================================================================================================== */

// ---------------------------------------------------------------------------------------- thème
const BG = [10, 12, 14];
const mix = (c, a, bg = BG) => c.map((v, i) => Math.round(v * a + bg[i] * (1 - a)));
const WHITE = [207, 210, 212], DIM = mix(WHITE, 0.62), FAINT = mix(WHITE, 0.30), LINE = mix(WHITE, 0.55),
  TRACKC = mix(WHITE, 0.14), INK = [12, 15, 18], RED = [158, 74, 74], REDT = [194, 106, 106],
  REDINK = [246, 236, 236], REDDIM = mix(RED, 0.45), BGT = [5, 6, 7];
const STYLES = [];
function S(fg = WHITE, bg = BG, bold = false) {
  STYLES.push({ fg: 'rgb(' + fg.join(',') + ')', bg: 'rgb(' + bg.join(',') + ')', base: bg === BG, bold });
  return STYLES.length - 1;
}
const t = {};
t.N = S(); t.B = S(WHITE, BG, true); t.D = S(DIM); t.F = S(FAINT); t.L = S(LINE); t.K = S(TRACKC);
t.R = S(REDT); t.RB = S(REDT, BG, true); t.RR = S(RED); t.RZ = S(REDDIM);
t.INV = S(INK, WHITE, true); t.INVN = S(INK, WHITE); t.ALERT = S(REDINK, RED, true); t.INKB = S(INK, BG, true);
t.T = S(WHITE, BGT, true); t.TD = S(DIM, BGT); t.TF = S(FAINT, BGT); t.TR = S(REDT, BGT, true);
t.TB = S(FAINT, BGT); // bande titre : filets

// ---------------------------------------------------------------------------------------- texte
// Une cellule = un caractère (les diacritiques combinants restent dans la cellule précédente).
function chars(s) {
  const out = [];
  for (const c of String(s)) {
    const cp = c.codePointAt(0);
    if (cp >= 0x300 && cp <= 0x36f && out.length) out[out.length - 1] += c; else out.push(c);
  }
  return out;
}
const slen = s => chars(s).length;
function clip(s, n) {
  const c = chars(s);
  if (n <= 0) return '';
  return c.length <= n ? c.join('') : (n > 1 ? c.slice(0, n - 1).join('') + '…' : c.slice(0, n).join(''));
}
const ljust = (s, n) => { s = String(s); return s + ' '.repeat(Math.max(0, n - slen(s))); };
const rjustS = (s, n) => { s = String(s); return ' '.repeat(Math.max(0, n - slen(s))) + s; };
const center = (s, n) => { s = String(s); const p = Math.max(0, n - slen(s)); const l = Math.floor(p / 2); return ' '.repeat(l) + s + ' '.repeat(p - l); };
const pad2 = n => String(Math.floor(n)).padStart(2, '0');
const fmtf = (v, d) => (v == null || !isFinite(v)) ? '—' : v.toFixed(d);

// ---------------------------------------------------------------------------------------- écran
class Screen {
  constructor(w, h) { this.resize(w, h); }
  resize(w, h) { this.w = w; this.h = h; this.ch = new Array(w * h).fill(' '); this.st = new Uint8Array(w * h); }
  clear(style = t.N) { this.ch.fill(' '); this.st.fill(style); this.vec = []; }
  vector(x, y, w, h, fn, clip = true) { (this.vec || (this.vec = [])).push({ x, y, w, h, fn, clip }); }
  put(x, y, text, style = t.N, w) {
    if (y < 0 || y >= this.h || text == null) return 0;
    let c = chars(text);
    if (w != null) c = c.slice(0, Math.max(0, w));
    let n = 0;
    for (let i = 0; i < c.length; i++) {
      const xi = x + i;
      if (xi >= this.w) break;
      if (xi >= 0) { this.ch[y * this.w + xi] = c[i]; this.st[y * this.w + xi] = style; n++; }
    }
    return c.length;
  }
  fill(x, y, w, h, c = ' ', style = t.N) { for (let yy = Math.max(0, y); yy < Math.min(this.h, y + h); yy++) this.put(x, yy, c.repeat(Math.max(0, w)), style); }
  get(x, y) { return (x >= 0 && x < this.w && y >= 0 && y < this.h) ? this.ch[y * this.w + x] : ' '; }
  text() { const out = []; for (let y = 0; y < this.h; y++) out.push(this.ch.slice(y * this.w, (y + 1) * this.w).join('').replace(/\s+$/, '')); return out.join('\n'); }
}

// ---------------------------------------------------------------------------------------- composants
class Rect {
  constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
  get r() { return this.x + this.w; }
  get b() { return this.y + this.h; }
  inset(dx = 1, dy = 1) { return new Rect(this.x + dx, this.y + dy, Math.max(0, this.w - 2 * dx), Math.max(0, this.h - 2 * dy)); }
  splitH(weights, gap = 1) {
    const fixed = weights.filter(w => w < 0).reduce((a, w) => a - w, 0);
    const flex = weights.filter(w => w > 0).reduce((a, w) => a + w, 0) || 1;
    const free = this.w - fixed - gap * (weights.length - 1);
    const out = []; let x = this.x;
    weights.forEach((w, i) => {
      let ww = w < 0 ? -w : Math.floor(free * w / flex);
      if (i === weights.length - 1) ww = this.r - x;
      out.push(new Rect(x, this.y, ww, this.h)); x += ww + gap;
    });
    return out;
  }
  splitV(weights, gap = 0) {
    const fixed = weights.filter(w => w < 0).reduce((a, w) => a - w, 0);
    const flex = weights.filter(w => w > 0).reduce((a, w) => a + w, 0) || 1;
    const free = this.h - fixed - gap * (weights.length - 1);
    const out = []; let y = this.y;
    weights.forEach((w, i) => {
      let hh = w < 0 ? -w : Math.floor(free * w / flex);
      if (i === weights.length - 1) hh = this.b - y;
      out.push(new Rect(this.x, y, this.w, hh)); y += hh + gap;
    });
    return out;
  }
}

const W = {};
W.rjust = (scr, xr, y, text, style = t.N) => { text = String(text); scr.put(xr - slen(text), y, text, style); };

W.panel = (scr, r, code, name, rt = '', rtStyle = t.TD, alert = false) => {
  if (r.w < 8 || r.h < 3) return new Rect(r.x, r.y, 0, 0);
  scr.fill(r.x, r.y, r.w, 1, ' ', t.T);
  let x = r.x;
  if (code) { scr.put(x, r.y, ' ' + code + ' ', alert ? t.ALERT : t.INV); x += slen(code) + 3; } else x += 1;
  rt = String(rt);
  const room = r.r - x - 1 - (rt ? slen(rt) + 2 : 0);
  scr.put(x, r.y, clip(name, room), t.T);
  if (rt) W.rjust(scr, r.r - 1, r.y, clip(rt, r.w - 8), rtStyle);
  for (let y = r.y + 1; y < r.b - 1; y++) { scr.put(r.x, y, '│', t.L); scr.put(r.r - 1, y, '│', t.L); }
  const y = r.b - 1;
  scr.put(r.x, y, '┗━' + '─'.repeat(Math.max(0, r.w - 4)) + '━┛', t.L);
  scr.put(r.x, y, '┗━', t.N);
  scr.put(r.r - 2, y, '━┛', t.N);
  return new Rect(r.x + 2, r.y + 1, r.w - 4, r.h - 2);
};

W.segBar = (scr, x, y, w, frac, redFrom = 0.8, alert = false) => {
  if (w <= 0) return;
  frac = (frac == null || frac !== frac) ? 0 : Math.max(0, Math.min(1, frac));
  const n = Math.round(frac * w);
  const red0 = redFrom != null ? Math.round(redFrom * w) : w;
  for (let i = 0; i < w; i++) {
    const on = i < n;
    const st = i >= red0 ? (on ? t.RR : t.RZ) : (on ? (alert ? t.RR : t.N) : t.K);
    scr.put(x + i, y, '■', st);
  }
};

W.thinBar = (scr, x, y, w, frac, alert = false) => {
  if (w <= 0) return;
  frac = (frac == null || frac !== frac) ? 0 : Math.max(0, Math.min(1, frac));
  const n = Math.round(frac * w);
  scr.put(x, y, '━'.repeat(n), alert ? t.RR : t.N);
  scr.put(x + n, y, '─'.repeat(w - n), t.K);
};

const BR = [[0x01, 0x08], [0x02, 0x10], [0x04, 0x20], [0x40, 0x80]];
W.canvas = (w, h) => Array.from({ length: Math.max(0, h) }, () => new Array(Math.max(0, w)).fill(0));
W.dot = (cells, px, py) => {
  px = Math.floor(px); py = Math.floor(py);
  const cx = Math.floor(px / 2), sx = px - cx * 2, cy = Math.floor(py / 4), sy = py - cy * 4;
  if (cy >= 0 && cy < cells.length && cx >= 0 && cx < cells[0].length) cells[cy][cx] |= BR[sy][sx];
};
W.line = (cells, x0, y0, x1, y1) => {
  const n = Math.floor(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) + 1;
  for (let i = 0; i <= n; i++) { const f = i / n; W.dot(cells, x0 + (x1 - x0) * f, y0 + (y1 - y0) * f); }
};
W.dashed = (cells, x0, y0, x1, y1, on = 2, off = 2) => {
  const n = Math.floor(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) + 1;
  for (let i = 0; i <= n; i++) { if (i % (on + off) < on) { const f = i / n; W.dot(cells, x0 + (x1 - x0) * f, y0 + (y1 - y0) * f); } }
};
W.circle = (cells, cx, cy, r, step = 4) => { for (let a = 0; a < 360; a += step) W.dot(cells, cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)); };
W.blit = (scr, x, y, cells, style = t.N) => {
  cells.forEach((row, cy) => row.forEach((c, cx) => { if (c) scr.put(x + cx, y + cy, String.fromCharCode(0x2800 + c), style); }));
};
W.brailleArea = (scr, x, y, w, h, values, vmax, style = t.N, fill = true) => {
  if (w <= 0 || h <= 0) return;
  let pts = values.slice(-(w * 2));
  pts = new Array(w * 2 - pts.length).fill(0).concat(pts);
  const top = vmax || Math.max(Math.max(...pts), 1e-9);
  const dh = h * 4, cells = W.canvas(w, h);
  pts.forEach((v, i) => {
    const lv = v == null ? 0 : Math.round(Math.max(0, Math.min(1, v / top)) * dh);
    const cx = Math.floor(i / 2), sub = i % 2;
    const from = fill ? dh - lv : (lv ? dh - lv : dh);
    const to = fill ? dh : (lv ? dh - lv + 1 : dh);
    for (let d = from; d < to; d++) cells[Math.floor(d / 4)][cx] |= BR[d % 4][sub];
  });
  W.blit(scr, x, y, cells, style);
};

W.kv = (scr, x, y, w, key, value, ks = t.D, vs = t.N, dots = true) => {
  value = String(value);
  scr.put(x, y, clip(key, w), ks);
  if (dots) { const gap = w - slen(key) - slen(value) - 2; if (gap > 0) scr.put(x + slen(key) + 1, y, '·'.repeat(gap), t.F); }
  W.rjust(scr, x + w, y, clip(value, w - slen(key) - 1), vs);
};

W.box = (scr, x, y, w, h, style = t.L, fill = null) => {
  if (w < 2 || h < 2) return;
  scr.put(x, y, '┌' + '─'.repeat(w - 2) + '┐', style);
  for (let yy = y + 1; yy < y + h - 1; yy++) {
    scr.put(x, yy, '│', style); scr.put(x + w - 1, yy, '│', style);
    if (fill != null) scr.put(x + 1, yy, ' '.repeat(w - 2), fill);
  }
  scr.put(x, y + h - 1, '└' + '─'.repeat(w - 2) + '┘', style);
};

const TILE = {
  nom: [t.F, t.D, t.F, null], caut: [t.RR, t.RB, t.R, null], crit: [t.ALERT, t.ALERT, t.ALERT, t.ALERT],
  critoff: [t.RR, t.R, t.R, null], on: [t.INV, t.INV, t.INVN, t.INV], lit: [t.N, t.B, t.N, null], na: [t.K, t.F, t.F, null],
};
// Voyant allumé (CRIT, ou test des voyants) : fond rouge vif (blanc au test) posé exactement entre les axes des
// filets, filets blancs par-dessus, texte blanc gras. Rien ne dépasse du cadre : le fond n'est plus une couleur de
// cellule (qui couvrait toute la hauteur de la ligne de cadre), mais un rectangle de la couche vectorielle.
const LAMP_RED = 'rgb(214,38,38)';
const lampLit = st => st === 'crit' || st === 'on';
W.lampFill = (scr, x, y, w, h, col) => scr.vector(x, y, w, h, (c, b) => {
  const x0 = Math.round(b.x + b.cw / 2), x1 = Math.round(b.x + b.w - b.cw / 2), y0 = Math.round(b.y + b.ch / 2), y1 = Math.round(b.y + b.h - b.ch / 2);
  c.fillStyle = col; c.fillRect(x0, y0, x1 - x0, y1 - y0);
});
W.tile = (scr, x, y, w, h, label, value = '', state = 'nom') => {
  let [bst, lst, vst, fill] = TILE[state] || TILE.nom;
  if (lampLit(state)) { bst = t.N; fill = null; lst = vst = state === 'on' ? t.INKB : t.B; W.lampFill(scr, x, y, w, h, state === 'on' ? COL.N : LAMP_RED); }
  W.box(scr, x, y, w, h, bst, fill);
  const room = h - 2;
  const lines = String(label).split('\n').filter(Boolean).slice(0, Math.max(1, room)).map(s => [s, lst]);
  if (value !== '' && room > lines.length) lines.push([String(value), vst]);
  const top = y + 1 + Math.max(0, Math.floor((room - lines.length) / 2));
  lines.forEach(([s, st], i) => scr.put(x + 1, top + i, center(clip(s, w - 2), w - 2), st));
};
// Panneau d'annonciateurs à filets communs. items = [[libellé, état]]. Renvoie la hauteur.
// Filets dessinés en vectoriel (et non en caractères de cadre) : une case en alarme a son propre cadre, posé
// exactement sur ses filets (blanc et fond rouge vif si allumée, rouge si CAUT) sans déborder sur les voisines.
W.tileGrid = (scr, x, y, cols, cw, items, hits) => {
  const rows = Math.ceil(items.length / cols), gw = cols * (cw + 1) + 1, gh = rows * 2 + 1;
  scr.vector(x, y, gw, gh, (c, b) => {
    const lw = Math.max(1, Math.round(b.cw * 0.1)), X = k => Math.round(b.x + (k * (cw + 1) + 0.5) * b.cw), Y = k => Math.round(b.y + (2 * k + 0.5) * b.ch);
    const off = lw % 2 ? 0.5 : 0;
    c.lineWidth = lw; c.strokeStyle = COL.F; c.beginPath();
    for (let r = 0; r <= rows; r++) { c.moveTo(X(0), Y(r) + off); c.lineTo(X(cols), Y(r) + off); }
    for (let k = 0; k <= cols; k++) { c.moveTo(X(k) + off, Y(0)); c.lineTo(X(k) + off, Y(rows)); }
    c.stroke();
    items.forEach(([, state], i) => {
      const r = Math.floor(i / cols), k = i % cols, lit = lampLit(state);
      if (!lit && state !== 'caut' && state !== 'critoff') return;
      const x0 = X(k), x1 = X(k + 1), y0 = Y(r), y1 = Y(r + 1);
      if (lit) { c.fillStyle = state === 'on' ? COL.N : LAMP_RED; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
      c.strokeStyle = lit ? COL.N : COL.RR; c.lineWidth = lw; c.strokeRect(x0 + off, y0 + off, x1 - x0, y1 - y0);
    });
  }, false);
  items.forEach(([label, state, fn], i) => {
    const r = Math.floor(i / cols), k = i % cols, cx = x + k * (cw + 1), cy = y + 2 * r;
    const [, lst0, , fill] = TILE[state] || TILE.nom, lit = lampLit(state);
    scr.put(cx + 1, cy + 1, center(clip(label, cw), cw), lit ? (state === 'on' ? t.INKB : t.B) : (state === 'critoff' ? t.RB : (fill != null ? t.B : lst0)));
    if (hits && fn) hits.push({ x: cx + 1, y: cy + 1, w: cw, h: 1, fn });
  });
  return gh;
};

W.limStyle = active => active ? t.RR : t.RZ;

// 7 segments en traits gras des caractères de cadre
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg', '5': 'acdfg', '6': 'acdefg', '7': 'abc',
  '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '', 'A': 'abcefg', 'b': 'cdefg', 'C': 'adef', 'd': 'bcdeg', 'E': 'adefg',
  'F': 'aefg', 'H': 'bcefg', 'L': 'def', 'P': 'abefg', 'r': 'eg', 'o': 'cdeg', 'n': 'ceg', 'U': 'bcdef', 't': 'defg',
  'S': 'acdfg', 'I': 'bc', 'O': 'abcdef', 'G': 'acdef', 'i': 'c', 'u': 'cde', 'y': 'bcdfg', 'J': 'bcde', 'h': 'cefg' };
const HV = { '0000': ' ', '1000': '╹', '0100': '╻', '0010': '╸', '0001': '╺', '1100': '┃', '0011': '━', '0101': '┏',
  '0110': '┓', '1001': '┗', '1010': '┛', '1101': '┣', '1110': '┫', '0111': '┳', '1011': '┻', '1111': '╋' };
function segDirs(segs) {
  const [a, b, c, d, e, f, g] = 'abcdefg'.split('').map(k => segs.includes(k) ? 1 : 0);
  return [[[0, f, 0, a], [0, 0, a, a], [0, b, a, 0]], [[f, e, 0, g], [0, 0, g, g], [b, c, g, 0]], [[e, 0, 0, d], [0, 0, d, d], [c, 0, d, 0]]];
}
const GHOST = segDirs('abcdefg');
W.seg7Width = text => Math.max(0, chars(text).reduce((a, ch) => a + (ch === '.' ? 0 : (ch === ':' ? 2 : 4)), 0) - 1);
W.readout = (scr, x, y, w, label, text, unit = '', style = t.N, alert = false, ghost = true, ndig = null, uw = null) => {
  text = ndig ? String(text).trim() : String(text);
  if (ndig) text = ' '.repeat(Math.max(0, ndig - chars(text).filter(c => c !== '.' && c !== ':').length)) + text;
  W.box(scr, x, y, w, 5, alert ? t.RR : t.L);
  scr.put(x + 2, y, ' ' + label + ' ', alert ? t.RB : t.D);
  uw = Math.max(uw || 0, slen(unit));
  const sx = x + w - 2 - (uw ? uw + 1 : 0) - W.seg7Width(text);
  W.seg7(scr, Math.max(x + 2, sx), y + 1, text, alert ? t.RB : style, ghost ? t.K : null);
  if (unit) scr.put(x + w - 2 - uw, y + 3, unit, alert ? t.R : t.D);
};

const V8 = ' ▁▂▃▄▅▆▇█', H8 = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
const frac01 = f => (f == null || f !== f) ? 0 : Math.max(0, Math.min(1, f));

// Ruban vertical gradué (largeur 8)
W.vtape = (scr, x, y, h, frac, value = '', label = '', alert = false, marks = [], top = '', bot = '', stale = false, low = false) => {
  const th = h - 6;
  if (th < 2) return;
  frac = frac01(frac);
  marks = marks.slice().sort((a, b) => a[0] - b[0]);

// Barre horizontale encadrée (3 lignes)
W.hbar = (scr, x, y, w, frac, alert = false, marks = [], ticks = 4, center0 = false, low = false) => {
  const iw = w - 2;
  if (iw < 2) return;
  frac = frac01(frac);
  scr.put(x, y, '┌' + '─'.repeat(iw) + '┐', t.L);
  scr.put(x, y + 1, '│', t.L);

    const mid = iw / 2, pos = frac * iw;

    scr.put(x + 1, y + 1, body, alert ? t.RR : t.N);
  } else {
    const n = Math.round(frac * iw * 8), full = Math.floor(n / 8), part = n % 8;
    const body = '█'.repeat(full) + (part ? H8[part] : '');

  }

  marks = marks.slice().sort((a, b) => a - b);
  const act = marks.map(m => low ? frac <= m : frac >= m);            // low : seuils bas (zone rouge sous la marque)
  const tickCols = new Set(); for (let k = 1; k < ticks; k++) tickCols.add(Math.round(k / ticks * iw) - 1);

  scr.put(x, y + 2, '└', t.L);

    if (low) { for (let k = 0; k < marks.length; k++) if (f < marks[k]) { z = k; break; } }
    else for (let k = marks.length - 1; k >= 0; k--) if (f > marks[k]) { z = k; break; }
    const st = z == null ? t.L : W.limStyle(act[z]);

// Courbe(s) avec axes. Axes, graduations et libellés en cellules ; tracé, aire, grille et seuils en vecteurs,
// à leur valeur exacte. series = [[valeurs, style]], la plus récente en dernier, une valeur toutes les step s.
W.plot = (scr, r, series, o = {}) => {

  const step = o.step || 1, xfmt = o.xfmt || W.relTime, xminCells = o.xminCells || 12;
  const vals = []; series.forEach(([s]) => s.forEach(v => { if (v != null) vals.push(v); }));

    const span = Math.max(hi - lo, o.minSpan || 1), stepv = W.niceMax(span / 2);

    if (vmax - vmin < stepv * 2) vmax = vmin + stepv * 2;

  if (!yticks) { const n = ph >= 8 ? 5 : 3; yticks = Array.from({ length: n }, (_, i) => vmin + (vmax - vmin) * i / (n - 1)); }

  const mkW = marker ? Math.max(0, ...series.map(([vs]) => vs.length && vs[vs.length - 1] != null ? slen(fmt(vs[vs.length - 1]) + unit) : 0)) : 0;
  const limW = Math.max(0, ...limits.map(l => l[2] ? slen(l[2]) : 0));

  const rowOf = v => Math.max(0, Math.min(ph, Math.round(yRow(v) - 0.5)));
  for (let i = 0; i < ph; i++) scr.put(ax, r.y + i, '│', t.L);
  yticks.forEach((v, k) => { const row = rowOf(v); scr.put(r.x, r.y + row, rjustS(labels[k], gw), t.D); if (row < ph) scr.put(ax, r.y + row, '┤', t.L); });

  const yax = r.y + ph;
  scr.put(ax, yax, '└' + '─'.repeat(pw), t.L);

  const spd = o.fit ? (nmax - 1) * step / (pw * 2 - 1) : step, span = pw * 2 * spd;

  });
  if (marker) series.forEach(([vs], n) => {
    if (!vs.length || vs[vs.length - 1] == null) return;
    const row0 = rowOf(vs[vs.length - 1]); let row = row0;
    outer: for (let d = 0; d < ph; d++) for (const c of [row0 + d, row0 - d]) if (c >= 0 && c < ph && !used.has(c)) { row = c; break outer; }

    c.lineWidth = d;

      }
    });
  });

};

// Histogramme avec axes : barres vectorielles à leur hauteur exacte, seuils en tirets
W.bars = (scr, r, values, o = {}) => {

// ------------------------------------------------------------------ M32 FAIL PAGE : défauts, instructions, acquittement
function wrap(text, w) {
  const out = []; let line = '';
  for (const word of String(text).split(/\s+/)) {
    if (!word) continue;
    if (line && slen(line) + 1 + slen(word) > w) { out.push(line); line = word; } else line = line ? line + ' ' + word : word;
  }
  if (line) out.push(line); return out;
}
// Sélection des défauts visés par une commande : rien = le défaut choisi, n = rang affiché, ALL, ou nom (BATT, DEP, GNSS…)
function failPick(arg) {
  const L = FAIL.list;
  if (!arg) { const e = L.find(x => x.id === FAIL.sel) || failView()[0]; return e ? [e] : []; }
  if (arg === 'ALL') return L.slice();
  if (/^\d+$/.test(arg)) { const V = failView(); return V[+arg - 1] ? [V[+arg - 1]] : []; }
  const a = arg.replace(/[^A-Z0-9]/g, '');
  return L.filter(e => e.key.replace(/^FCU\./, '').toUpperCase() === a || e.tag === a || e.key.toUpperCase() === arg || e.msg.replace(/[^A-Z0-9]/g, '').startsWith(a));
}
function failCmdAck(app, arg) {
  const es = failPick(arg);
  if (!FAIL.list.length) return app.say('ACK · NO FAULT RECORDED');
  if (!es.length) return app.say('ACK · NO FAULT ' + arg + ' · SEE ' + pageAddr('M32'), true);
  const n = es.reduce((k, e) => k + failAck(e), 0);
  if (n) { failSave(); log('ACK', (arg === 'ALL' ? 'ACK ALL · ' : 'ACK · ') + (es.length === 1 ? es[0].msg : n + ' FAULTS')); haptic(15); }
  app.say(n ? 'ACK · ' + n + ' FAULT' + (n > 1 ? 'S' : '') + ' ACKNOWLEDGED' : 'ACK · ALREADY ACKNOWLEDGED');

  ticks.forEach((v, k) => { const rw2 = rowOf(v); scr.put(r.x, r.y + rw2, rjustS(labs[k], gw), t.D); if (rw2 < ph) scr.put(ax, r.y + rw2, '┤', t.L); });

    mm.forEach((v, k) => {
      if (!v) return;

      const P = v => b.y + (0.5 + (100 - v) / 100 * ph) * b.ch, pts = pop.map((v, k) => v == null ? null : [b.x + (k + 0.5) * sw, P(v)]).filter(Boolean);

      pts.forEach(([px, py]) => { c.beginPath(); c.arc(px, py, 1.4 * d, 0, 2 * Math.PI); c.fillStyle = COL.D; c.fill(); });

  const R = idx.map(i => (w.hpr && w.hpr[i]) || 0), P = w.hpop ? idx.map(i => w.hpop[i]) : null, tn = Date.now();

  for (let j = 0; j < ph; j++) scr.put(ax, y0 + j, '│', t.L);
  scr.put(ax, y0 + ph, '└' + '─'.repeat(pw), t.L);

// ------------------------------------------------------------------ cadran du ciel commun (SATS, RELAYS)
function skyDial(c, b, rot, mask) {
  const d = b.d, fs = b.fpx, R = Math.min(b.w, b.h) / 2 - fs * 0.95, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const proj = (az, el) => { const rr = (90 - Math.max(0, el)) / 90 * R, aa = (az - rot) * RAD; return [cx + rr * Math.sin(aa), cy - rr * Math.cos(aa)]; };
  c.fillStyle = rgba(WHITE, 0.035); c.beginPath(); c.arc(cx, cy, R, 0, 2 * Math.PI); c.fill();
  c.strokeStyle = COL.L; c.lineWidth = 1.2 * d; c.stroke();
  c.strokeStyle = COL.K; c.lineWidth = d; dash(c, d, 1, 3);
  for (const k of [1 / 3, 2 / 3]) { c.beginPath(); c.arc(cx, cy, R * k, 0, 2 * Math.PI); c.stroke(); }
  c.beginPath(); for (let az = 0; az < 360; az += 45) { const [x, y] = proj(az, 0); c.moveTo(cx, cy); c.lineTo(x, y); } c.stroke();
  if (mask) { c.strokeStyle = COL.RZ; dash(c, d, 2, 3); c.beginPath(); c.arc(cx, cy, R * (90 - mask) / 90, 0, 2 * Math.PI); c.stroke(); }
  dash(c, d, 0);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const [lab, az] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
    const rr = R + fs * 0.55, aa = (az - rot) * RAD;
    c.font = (lab === 'N' ? '700 ' : '400 ') + (fs * 0.9).toFixed(1) + 'px ' + b.family; c.fillStyle = lab === 'N' ? COL.N : COL.D;
    c.fillText(lab, cx + rr * Math.sin(aa), cy - rr * Math.cos(aa));
  }
  c.font = '400 ' + (fs * 0.56).toFixed(1) + 'px ' + b.family;
  return { proj, R, cx, cy, d, fs };
}
// symboles : G cercle, E losange, R triangle, C carré, relais : ▲ Iridium, · OneWeb, ◆ amateur, ■ TDRS, | GEO
function satGlyph(c, k, x, y, s, fill, col) {
  c.fillStyle = col; c.strokeStyle = col; c.lineWidth = Math.max(1, s * 0.35);
  c.beginPath();
  if (k === 'G' || k === 'O') c.arc(x, y, s, 0, 2 * Math.PI);
  else if (k === 'E' || k === 'A') { c.moveTo(x, y - s * 1.25); c.lineTo(x + s * 1.25, y); c.lineTo(x, y + s * 1.25); c.lineTo(x - s * 1.25, y); c.closePath(); }
  else if (k === 'R' || k === 'I') { c.moveTo(x, y - s * 1.2); c.lineTo(x + s * 1.1, y + s * 0.8); c.lineTo(x - s * 1.1, y + s * 0.8); c.closePath(); }
  else if (k === 'Q') { c.moveTo(x, y - s * 1.3); c.lineTo(x, y + s * 1.3); c.stroke(); return; }
  else c.rect(x - s, y - s, 2 * s, 2 * s);
  if (fill) c.fill(); else c.stroke();
}

//  2. ALARM  : l'alarme du réveil Android prévue ce matin (retenue la veille par l'APK), si le premier
//     déverrouillage durable tombe entre 30 min avant et 90 min après elle, ou s'il n'est pas connu ;
//  3. UNLOCK : premier déverrouillage durable après 03:00, coups d'œil nocturnes écartés (APK + accès usage) ;
//  4. AUTO   : première activité de Grafit après une coupure de 4 h, entre 03:00 et 14:00 (repli, web surtout).

function briefLines() {
  const L = [], w = SRC.wx.v, T = now(), h = DAYREC.hist.find(x => x.d === ymdOf(T)), goal = (SET.sleepGoal || 8) * 3600;
  // nuit : coucher → réveil, durée face à l'objectif, bilan 7 nuits

  if (DAYREC.wake) {
    const bed = h && h.bed ? h.bed : null, sl = bed && DAYREC.wake - bed > 2 * 3600 && DAYREC.wake - bed < 16 * 3600 ? DAYREC.wake - bed : null;
    L.push(['WOKE UP', hhmm(DAYREC.wake) + ' · ' + DAYREC.src + (bed ? ' · BED ' + hhmm(bed) : '')]);
    if (sl) L.push(['SLEEP', durHM(sl) + (sl >= goal ? ' · GOAL MET' : ' · ' + durHM(goal - sl) + ' SHORT')]);
    const ss = sleepStats(health7());
    if (ss.n >= 3) L.push(['7 NIGHTS', debtTxt(ss.debt) + ' · REG ' + regTxt(ss.sdWake)]);
  } else L.push(['WOKE UP', 'NOT SET · WAKE 7:15']);
  // météo : maintenant, tranches du jour (comme 4.3), pluie (prévision puis radar)
  L.push(['', ''], ['WEATHER', live('wx') ? wxHead(w) : '']);
  if (live('wx')) {
    const d0 = w.days && w.days[0];
    L.push(['NOW', w.temp.toFixed(1) + ' °C · ' + WMO_S(w.code) + (d0 ? ' · ' + Math.round(d0.tmin) + '/' + Math.round(d0.tmax) + ' °C' : '')]);
    if (w.hms) {

      for (let sl = sl0; sl <= 3; sl++) {
        const a = m0 + sl * 6 * 3600000, sp = wxSpan(w, a, a + 6 * 3600000); if (!sp) continue;
        L.push([PERIOD_N[sl], WMO_S(sp.code) + ' ' + tRange(sp.tmin, sp.tmax) + ' · ' + (sp.pop ?? 0) + '%' + (sp.mm >= 0.1 ? ' ' + sp.mm.toFixed(1) + 'mm' : '') + (sp.gust != null && sp.gust >= 40 ? ' · G' + Math.round(sp.gust) : '')]);
      }
    }
    L.push(['RAIN', rainText(rainOutlook(w))]);

  } else L.push(['—', 'NO WEATHER FEED']);

  if (nn && nn.state !== 'na' && nn.state !== 'stale') L.push(['RADAR', ncText(nn) + (nn.r.wet && ncMotion(nn.r) ? ' · ' + ncMotion(nn.r).replace(' · ', ' ') : '')]);

  try { const hh = here(), si = A.sunInfo(T, hh.lat, hh.lon); if (si.rise && si.set) L.push(['SUN', 'RISE ' + hhmm(si.rise) + ' · SET ' + hhmm(si.set)]); } catch (e) { /* */ }

  if (!ev.length) L.push(['—', AGENDA.src === 'NONE' ? 'NO AGENDA SOURCE' : 'NO EVENT TODAY']);

  if (ev.length > 4) L.push(['', '+ ' + (ev.length - 4) + ' MORE · ' + pageAddr('M52')]);

  const fs = failStats(), fa = FAIL.list.find(e => !e.tend && e.sev >= 2);

  if (live('batt')) {
    const b = SRC.batt.v, rt = battRate(), pct = Math.round(b.level * 100);
    L.push(['BATTERY', pct + ' %' + (b.charging ? ' · CHARGING' : '') + (rt != null && Math.abs(rt) >= 0.3 ? ' · ' + (rt > 0 ? '+' : '−') + Math.abs(rt).toFixed(1) + ' %/h' : '')

}

// Touche : relief, coins arrondis, libellé vectoriel ; seules les touches sont cliquables.
function button(scr, x, y, w, h, head, tail, fn, o = {}) {
  const on = !!o.on, dead = !!o.dead;
  scr.vector(x, y, w, h, (c, b) => {
    const d = b.d, ins = 2 * d, X = Math.round(b.x + ins), Y = Math.round(b.y + ins), Wb = Math.round(b.w - 2 * ins), Hb = Math.round(b.h - 2 * ins);
    c.fillStyle = on ? COL.N : (o.red ? COL.RR : (dead ? '#0d1012' : '#1b1f23')); c.fillRect(X, Y, Wb, Hb);
    if (!on) { c.strokeStyle = dead ? COL.K : COL.L; c.lineWidth = d; c.strokeRect(X + 0.5 * d, Y + 0.5 * d, Wb - d, Hb - d); }
    const fg = on ? 'rgb(' + INK.join(',') + ')' : (dead ? COL.F : COL.N), fg2 = on ? 'rgba(' + INK.join(',') + ',0.7)' : (dead ? COL.F : COL.D);
    const fs = b.fpx * (o.small ? 0.78 : 1);
    c.textBaseline = 'middle';
    if (tail && Hb > fs * 2.1) {
      c.textAlign = 'center';
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; c.fillStyle = fg; c.fillText(head, X + Wb / 2, Y + Hb * 0.38);
      c.font = '400 ' + (fs * 0.72).toFixed(1) + 'px ' + b.family; c.fillStyle = fg2; c.fillText(tail, X + Wb / 2, Y + Hb * 0.74);
    } else {
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; const w1 = c.measureText(head).width;
      c.font = '400 ' + (fs * 0.8).toFixed(1) + 'px ' + b.family; const w2 = tail ? c.measureText(' ' + tail).width : 0;
      let tx = X + (Wb - w1 - w2) / 2; c.textAlign = 'left';
      c.font = '700 ' + fs.toFixed(1) + 'px ' + b.family; c.fillStyle = fg; c.fillText(head, tx, Y + Hb / 2 + 0.5 * d);
      if (tail) { c.font = '400 ' + (fs * 0.8).toFixed(1) + 'px ' + b.family; c.fillStyle = fg2; c.fillText(' ' + tail, tx + w1, Y + Hb / 2 + 0.5 * d); }
    }
  }, false);
  if (fn && !dead) app_hit(x, y, w, h, () => { haptic(8); fn(); });
}

class App {
  constructor() {
    this.cmd = null; this.msg = ''; this.msgT = 0; this.msgWarn = false; this.armed = null;
    this.pad = null; this.padT = 0; this.prev = null; this.lampT0 = 0; this.t0 = now(); this.hits = [];
    this.gi = 0; this.pi = GROUPS.map(() => 0);        // démarrage toujours sur 1.1 (M11 OVERVIEW)
    this.splash = now(); this.ready = false;          // écran de chargement, puis attente d'un geste
  }
  get page() { return PAGES[GROUPS[this.gi][3][this.pi[this.gi]]]; }
  show(gi, pi) {
    const cur = [this.gi, this.pi[this.gi]];
    this.gi = ((gi % GROUPS.length) + GROUPS.length) % GROUPS.length;
    const n = GROUPS[this.gi][3].length;
    this.pi[this.gi] = pi == null ? 0 : ((pi % n) + n) % n;          // changement de groupe : retour au format .1
    if (this.gi !== cur[0] || this.pi[this.gi] !== cur[1]) this.prev = cur;
    this.helpOv = null;
  }
  step(dd) { this.show(this.gi, this.pi[this.gi] + dd); }          // sous-section suivante / précédente du groupe
  go(code, sel) { const hit = this.find(code); if (hit) { this.show(...hit); if (sel && this.page.sel !== undefined) this.page.sel = sel; } }
  address() { return (this.gi + 1) + '.' + (this.pi[this.gi] + 1); }
  blink() { return Math.floor(Date.now() / 500) % 2 === 0; }      // annonciateur CRITICAL : 1 Hz
  lampTest() { this.lampT0 = now(); log('SYS', 'LAMP TEST'); haptic([60, 240, 60, 240, 60, 240, 60, 240]); }
  lamp() {
    if (!this.lampT0) return null;
    const k = Math.floor((now() - this.lampT0) / (CFG.UI.LampStepMs / 1000));
    if (k >= 9) { this.lampT0 = 0; return null; }
    return { ann: k < 4 ? 1 : (k < 8 ? 2 : 0), lit: null, k };
  }
  find(word) {
    const wd = String(word).trim().toUpperCase(); if (!wd) return null;
    const m = wd.match(/^(\d)\.(\d)$/);
    if (m) { const g = +m[1] - 1, f = +m[2] - 1; if (GROUPS[g] && GROUPS[g][3][f]) return [g, f]; }
    for (let gi = 0; gi < GROUPS.length; gi++) for (let pi = 0; pi < GROUPS[gi][3].length; pi++) {
      const code = GROUPS[gi][3][pi], p = PAGES[code];
      if (code === wd || code.slice(1) === wd.replace(/^[SM]/, '').padStart(2, '0') && /^[SM]?\d+$/.test(wd) && (wd[0] === code[0] || /^\d/.test(wd))) return [gi, pi];
      if ([p.name.replace(' · ', ' ')].concat(p.words).some(n => n === wd || n.startsWith(wd) || n.split(' ')[0] === wd)) return [gi, pi];
    }
    return null;
  }
  say(text, warn = false) { this.msg = text; this.msgT = now(); this.msgWarn = warn; this.msgN = (this.msgN || 0) + 1; }
  // ---------------------------------------------------------- commandes : une seule grammaire pour tous les formats
  //   <FORMAT>                  2.3 · M41 · M43 · WEATHER                    navigation
  //   *n                        action n du format affiché (comme * puis n au pavé)
  //   <ACTION> [ARG]            ACK 2 · SIM ON · HDG OFF                     format affiché, sinon groupe, sinon Grafit
  //   <FORMAT> <ACTION|n> [ARG] FAIL ACK ALL · WX REFRESH · M81 3            action d'un autre format, qui s'affiche
  //   HELP [FORMAT|ALL]
  // Une action d'un autre format s'exécute si elle est unique (ou si toutes ses occurrences font la même chose).
  static norm(x) { return String(x).toUpperCase().replace(/−/g, '-').replace(/[^A-Z0-9+\-]/g, ''); }
  acts(p) {
    return (p.keys || []).map(k => ({ p, k: k[0], lab: k[1], fn: k[2], words: (k[3] || [k[1]]).map(App.norm), syn: k[4] || null }))
      .concat((p.cmds || []).map(c => ({ p, k: null, lab: c[0][0], fn: c[1], words: c[0].map(App.norm), syn: c[2] || null })));
  }
  matchAct(p, toks) {                                   // plus long préfixe de mots d'abord : ACK ALL avant ACK + ALL
    const acts = this.acts(p);
    for (let i = toks.length; i >= 1; i--) {
      const w = App.norm(toks.slice(0, i).join(''));
      const a = w && acts.find(x => x.words.includes(w));
      if (a) return { a, arg: toks.slice(i).join(' '), word: w };
    }
    return null;
  }
  actByKey(p, k, rest) { const a = this.acts(p).find(x => x.k === k); return a ? { a, arg: rest.join(' '), word: '' } : null; }
  findExact(word) {                                     // adresse, code ou nom / mot-clé exact (pas de début de mot)
    const wd = String(word).toUpperCase();
    const m = wd.match(/^(\d)\.(\d{1,2})$/);
    if (m) { const g = +m[1] - 1, f = +m[2] - 1; return GROUPS[g] && GROUPS[g][3][f] ? [g, f] : null; }
    for (let gi = 0; gi < GROUPS.length; gi++) for (let pi = 0; pi < GROUPS[gi][3].length; pi++) {
      const code = GROUPS[gi][3][pi], p = PAGES[code];
      if (code === wd || [p.name.replace(' · ', ' ').replace(/ /g, '')].concat(p.words.map(x => x.replace(/ /g, ''))).includes(wd)) return [gi, pi];
    }
    return null;
  }
  run(m) {
    const n0 = this.msgN || 0;
    try { m.a.fn(this, m.arg, m.word); } catch (e) { console.error(e); return this.say('COMMAND FAULT · ' + e.message, true); }
    if ((this.msgN || 0) === n0) this.say(m.a.p.code + ' · ' + m.a.lab + (m.arg ? ' ' + m.arg : ''));
  }
  execute(line) {
    line = line.trim(); if (!line) return;
    this.rawLine = line;
    this.helpOv = null;
    const toks = line.toUpperCase().split(/\s+/), v = toks[0];
    if (['HELP', '?', 'H'].includes(v)) return this.help(toks.slice(1).join(' '));
    const st = v.match(/^\*(\d)$/);
    if (st) { if (!this.action(st[1], toks.slice(1).join(' '))) this.say('NO ACTION *' + st[1] + ' ON ' + this.page.code + ' ' + this.page.name, true); return; }
    let m = this.matchAct(this.page, toks), qual = null;                     // 1. format affiché
    if (m) return this.run(m);
    if (toks.length > 1) {                                                   // 2. <FORMAT> <ACTION|n> [ARG]
      const hit = this.findExact(v);
      if (hit) {
        const p = PAGES[GROUPS[hit[0]][3][hit[1]]], rest = toks.slice(1), dm = rest[0].match(/^\*?(\d)$/);
        m = dm ? this.actByKey(p, dm[1], rest.slice(1)) : this.matchAct(p, rest);
        if (m) { this.show(...hit); return this.run(m); }
        m = this.matchAct(p, toks);                                          // TIMER 7:30 : le nom du format est aussi une commande
        if (m) return this.run(m);
        qual = p.code + ' ' + p.name + ' · NO ACTION ' + rest.join(' ') + ' · HELP ' + p.code;
      }
    }
    if (toks.length === 1) { const hit = this.findExact(v); if (hit) return this.show(...hit); }   // 3. nom exact de format
    const cands = [];                                                        // 4. action d'un autre format
    for (const g of GROUPS) for (const code of g[3]) { if (PAGES[code] === this.page) continue; const c = this.matchAct(PAGES[code], toks); if (c) cands.push(c); }
    if (cands.length) {
      const grp = cands.filter(c => GROUPS[this.gi][3].includes(c.a.p.code)), pool = grp.length ? grp : cands;
      if (new Set(pool.map(c => c.a.fn)).size === 1) return this.run(pool[0]);
      return this.say(pool[0].word + ' · ON ' + pool.map(c => c.a.p.code).join(' ') + ' · TYPE <FORMAT> ' + v, true);
    }
    const hit = this.find(line); if (hit) return this.show(...hit);         // 5. adresse, code, début de nom
    this.say(qual || 'UNKNOWN COMMAND · ' + line.toUpperCase() + ' · TYPE HELP', true);
  }
  // aide : surimpression à la place du format (ESC, une touche de navigation ou une commande la ferme)
  help(arg) {
    if (arg === 'ALL' || arg === 'COMMANDS') {
      this.helpOv = { t: now(), title: 'COMMANDS', rt: 'ALL FORMATS', lines: [
        ['NAVIGATION', ''], ['2.3', 'FORMAT BY ADDRESS'], ['M41 · M43', 'FORMAT BY CODE'], ['WEATHER', 'BY NAME OR KEYWORD'], ['', ''],
        ['ACTIONS', 'SAME GRAMMAR ON EVERY FORMAT'], ['*n', 'ACTION n OF THIS FORMAT'], ['ACK 2', 'ACTION + ARGUMENT'],
        ['FAIL ACK ALL', 'FORMAT + ACTION + ARG'], ['M81 3', 'FORMAT + ACTION NUMBER'], ['', 'ELSEWHERE: IF UNIQUE'], ['', ''],
        ['COMMON', ''], ['ACK [n|ALL]', 'ACKNOWLEDGE FAULTS'], ['CLEAR [n|ALL]', "ERASE ACK'D ENDED FAULTS"], ['SEL [n|+|-]', 'SELECT ITEM'],
        ['LAMP', 'LAMP TEST'], ['REFRESH', 'RELOAD FEED OF THE GROUP'], ['SIM AUTO|ON|OFF', 'SIMULATION'], ['WAKE · HDG', '[ON|OFF] TOGGLES'],
        ['TIMER m:ss', 'COUNTDOWN'], ['ZOOM +|-|%', 'SCALE'], ['HELP [FORMAT]', 'ACTIONS OF A FORMAT']] };
      return;
    }
    let p = this.page;
    if (arg) { const hit = this.findExact(arg.replace(/\s+/g, '')) || this.find(arg); if (!hit) return this.say('HELP · NO FORMAT ' + arg, true); p = PAGES[GROUPS[hit[0]][3][hit[1]]]; }
    const lines = [];
    const acts = this.acts(p);
    if (!acts.length) lines.push(['—', 'NO ACTION ON THIS FORMAT']);
    for (const a of acts) {
      lines.push([(a.k ? '*' + a.k + ' ' : '   ') + (a.syn || (a.words[0] === App.norm(a.lab) ? a.lab : a.words[0])), a.lab]);
      const al = a.words.slice(1).filter(w => !(a.syn || '').toUpperCase().includes(w));
      if (al.length) lines.push(['', '= ' + al.join(' · ')]);
    }
    const at = GROUPS.findIndex(g => g[3].includes(p.code)), ad = (at + 1) + '.' + (GROUPS[at][3].indexOf(p.code) + 1);
    lines.push(['', ''], ['GO TO', ad + ' · ' + p.code + ' · ' + p.words[0]], ['FROM ELSEWHERE', p.code + ' <ACTION> [ARG]'], ['HELP ALL', 'FULL GRAMMAR']);
    this.helpOv = { t: now(), title: 'HELP · ' + p.code + ' ' + p.name, rt: ad, lines };
  }
  drawHelp(scr, r) {

  // bandeau : logo Orbital VKL, ГРАФИТ, date, heure, ВКЛ ● ; MET, état des alarmes, SIM (affichage seulement)

  // pupitre : onglets d'affichage (groupes, formats du groupe), espace, pavé de touches (+ et − : format suivant / précédent)
  drawConsole(scr, x0, y0, Wd) {

// contenu, toutes les 5 s quand 6.1 NETWORK est affiché, toutes les 30 s sinon, Grafit au premier plan seulement.
const NETP = { t: 0, busy: false, last: null, okT: 0, fails: 0, n: 0, lost: 0, rec: [], reset: null };

    NETP.rec.push([now(), ms]); rttMinute(ms);

  if (!j || j.app !== 'grafit-mobile' || !j.keys || typeof j.keys !== 'object') { log('SYS', 'RESTORE REFUSED · NOT A GRAFIT BACKUP', true); return APP && APP.say('RESTORE · NOT A GRAFIT BACKUP', true); }
  const ks = Object.keys(j.keys).filter(k => k.startsWith('grafit.') && typeof j.keys[k] === 'string');
  if (!ks.length) return APP && APP.say('RESTORE · EMPTY BACKUP', true);
  try {
    const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('grafit.')) old.push(k); }
    old.forEach(k => localStorage.removeItem(k)); ks.forEach(k => localStorage.setItem(k, j.keys[k]));
    const L = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    L.push([now(), 'SYS', 'RESTORED · BACKUP OF ' + ymdOf(j.t || now()) + ' ' + hhmm(j.t || now()) + ' · ' + ks.length + ' KEYS · GRAFIT ' + (j.version || '?'), false]);
    localStorage.setItem(LOG_KEY, JSON.stringify(L.slice(-LOG_MAX)));
  } catch (e) { log('SYS', 'RESTORE FAILED · ' + String(e.name || e).toUpperCase(), true); return APP && APP.say('RESTORE FAILED · ' + String(e.name || e).toUpperCase(), true); }
  // plus aucune écriture jusqu'au rechargement : les sauvegardes de fermeture écraseraient la restauration
  try { Storage.prototype.setItem = function () {}; Storage.prototype.removeItem = function () {}; } catch (e) { /* */ }
  if (APK && BGL.on !== false) nativeCmd({ cmd: 'bgCfg', vibe: !!(JSON.parse(j.keys['grafit.set'] || '{}').vibe ?? true) });
  APP && APP.say('RESTORED · ' + ks.length + ' KEYS · RELOADING');
  setTimeout(() => location.reload(), 700);
}
function cmdCsv(app) {
  const st = stamp(), D = healthN(35), tt = ts => ts ? hhmm(ts) : '', H = ['date,wake,bed,sleep_min,steps,active_min,screen_min,unlocks'];
  D.forEach(e => H.push([e.d.slice(0, 4) + '-' + e.d.slice(4, 6) + '-' + e.d.slice(6), tt(e.wake), tt(e.bed), e.sleep != null ? Math.round(e.sleep / 60) : '',
    e.steps ?? '', e.act != null ? Math.round(e.act) : '', e.scr != null ? Math.round(e.scr / 60) : '', e.un ?? ''].join(',')));
  saveText(app, 'grafit-health-' + st + '.csv', H.join('\n') + '\n', 'text/csv');
  if (APK) { nativeCmd({ cmd: 'exportCsv', name: 'grafit-samples-' + st + '.csv' }); app && app.say('CSV · HEALTH + ALL SAMPLES · DOWNLOAD/GRAFIT'); }
  log('SYS', 'CSV EXPORT · grafit-health-' + st + '.csv' + (APK ? ' · grafit-samples-' + st + '.csv' : ''));
}

// ---------------------------------------------------------------------------------------- widget (APK)
// Pluie (nowcast radar si pluie dans l'heure, sinon prévision), 3 prochains rendez-vous datés (le widget prend le
// premier à venir), température ; la batterie et l'heure viennent du journal continu.
const WG = { k: '', t: 0 };
function widgetTick(force = false) {
  if (!APK) return;
  const T = now(); if (!force && T - WG.t < 60) return; WG.t = T;
  const nn = ncNow(), ro = live('wx') ? rainOutlook(SRC.wx.v) : null;
  const rain = nn && nn.state === 'soon' ? 'RAIN ~' + hhmm(nn.at) + ' · ' + rainLabel(mmhOf(nn.peak)) + ' (RADAR)'
    : (nn && nn.state === 'now' ? 'RAINING · ' + rainLabel(mmhOf(nn.peak)) + (nn.until ? ' · ENDS ~' + hhmm(nn.until) : '') + ' (RADAR)' : (ro ? rainText(ro) : 'NO FORECAST'));
  const ev = AGENDA.occ.filter(o => o.start > T && !o.allDay).slice(0, 3).map(o => [o.start * 1000, o.title.toUpperCase()]);
  const extra = live('wx') ? Math.round(SRC.wx.v.temp) + ' °C ' + WMO_S(SRC.wx.v.code) : '';
  const k = rain + '|' + JSON.stringify(ev) + '|' + extra; if (k === WG.k && !force) return; WG.k = k;
  nativeCmd({ cmd: 'widget', rain, event: AGENDA.src === 'NONE' ? 'NO AGENDA SOURCE' : 'NO UPCOMING EVENT', extra, evs: JSON.stringify(ev) });
}

// ---------------------------------------------------------------------------------------- 6.4 S-16 : lien local avec le PC
// tools/s16-link.ps1, sur le S-16, diffuse l'état du PC en UDP sur le réseau local (port 47616) toutes les 5 s et son
// historique de 2 h chaque minute ; l'APK écoute au premier plan. Rien ne passe par Internet, aucun port n'est ouvert
// sur le PC. Seuils (affichage et journal, pas d'alarme Grafit) : CPU 85 °C, GPU 83 °C, RAM 90 %, disque < 10 % libre.
const S16 = { st: null, t: 0, ip: '', h: null, n: 0, up: false, al: {} };
const S16_LIM = { cpu: 85, gpu: 83, ram: 90, disk: 10 };
const s16Online = () => !!S16.t && now() - S16.t < 30;
const arrOf = v => Array.isArray(v) ? v : (v == null ? [] : [v]);
function s16Ingest(o) {
  if (!o || +o.v !== 1) return;
  if (o.k === 'h') { S16.h = { t0: +o.t0, step: +o.step || 60, ct: arrOf(o.ct), gt: arrOf(o.gt), cl: arrOf(o.cl), gl: arrOf(o.gl) }; return; }
  if (o.k !== 's') return;
  let dk = arrOf(o.disk); if (dk.length && !Array.isArray(dk[0])) dk = [dk]; o.disk = dk;
  S16.st = o; S16.t = now(); S16.ip = o.ip || ''; S16.n++;
  if (!S16.up) { S16.up = true; log('S16', 'LINK UP · ' + String(o.pc || 'PC').toUpperCase() + ' · ' + S16.ip); }
  const ct = o.cpu && o.cpu.t, gt = o.gpu && o.gpu.t, ram = o.ram && o.ram.t ? 100 * o.ram.u / o.ram.t : null, low = dk.filter(d => d[1] <= S16_LIM.disk).map(d => d[0]);
  const chk = (k, on, msg) => { if (on && !S16.al[k]) log('S16', msg, true); S16.al[k] = on; };
  chk('cpu', ct != null && ct >= S16_LIM.cpu, 'S-16 CPU HOT · ' + Math.round(ct) + ' °C');
  chk('gpu', gt != null && gt >= S16_LIM.gpu, 'S-16 GPU HOT · ' + Math.round(gt) + ' °C');
  chk('ram', ram != null && ram >= S16_LIM.ram, 'S-16 RAM ' + Math.round(ram) + ' % USED');
  chk('disk', low.length > 0, 'S-16 DISK ' + low.join(' ') + ' < ' + S16_LIM.disk + ' % FREE');
}
function s16Tick() {
  if (S16.up && !s16Online() && document.visibilityState === 'visible' && now() - VIS.fg > 40) { S16.up = false; log('S16', 'LINK LOST · NO PACKET FOR 30 S'); }
}
const upTxt = s => s == null ? '—' : (s >= 86400 ? Math.floor(s / 86400) + 'd ' : '') + durHM(s % 86400);
PAGES.M64 = { code: 'M64', name: 'S-16', ru: 'С-16', words: ['S16', 'PC', 'ARGON', 'COMPUTER', 'S16LINK'], fps: 1, g: 'T',
  keys: [['1', 'TEMP/LOAD', app => { PAGES.M64.g = PAGES.M64.g === 'T' ? 'L' : 'T'; app && app.say('S-16 GRAPH · ' + (PAGES.M64.g === 'T' ? 'TEMPERATURES' : 'LOADS')); }, ['GRAPH', 'TEMPLOAD', 'LOADS']]],
  draw(scr, r) {
    const o = S16.st, on = s16Online(), pc = o ? String(o.pc || 'PC').toUpperCase() : '';
    const ir = W.panel(scr, r, this.code, this.name, !o ? (APK ? 'NO LINK' : 'APK ONLY') : (on ? pc + ' · ' + S16.ip : 'LINK LOST · ' + ageTxt(now() - S16.t)), on ? t.TD : (o ? t.TR : t.TF));
    let y = ir.y;
    const kv = (k, v, st = t.N) => { if (y < ir.b) W.kv(scr, ir.x, y++, ir.w, k, v, t.D, st); };
    if (!o) {
      const L = [['SET UP', 'ONCE, ON THE S-16'], ['1 ▸', 'COPY s16-link.ps1 + s16-link-install.cmd'], ['', 'TO ONE FOLDER (E.G. C:\\Grafit)'], ['2 ▸', 'DOUBLE-CLICK s16-link-install.cmd'],
        ['', 'RUNS HIDDEN IN THE BACKGROUND, NOW'], ['', 'AND AT EACH LOGON · WINDOW CAN CLOSE'], ['', 'CHECK: s16-link.ps1 -Status'], ['3 ▸', 'CPU °C : HWINFO64 · SENSORS · CPU'],
        ['', 'TCTL/TDIE · REPORT VALUE IN GADGET'], ['4 ▸', 'PHONE ON THE SAME WI-FI, GRAFIT OPEN'], ['', ''], ['PRIVACY', 'UDP 47616 · LOCAL BROADCAST ONLY'], ['', 'NOTHING SENT TO INTERNET'], ['', 'NO PORT OPENED ON THE PC']];
      for (const [k, v] of L) { if (y >= ir.b) break; if (k === 'SET UP' || k === 'PRIVACY') { sub(scr, ir.x, y++, ir.w, k, v, t.D); continue; } scr.put(ir.x, y, k, t.B); scr.put(ir.x + 5, y++, clip(v, ir.w - 5), /^[A-Z0-9 ·:,()'\/−–-]+$/.test(v) ? t.D : t.N); }
      return;
    }
    const ct = o.cpu ? o.cpu.t : null, gt = o.gpu ? o.gpu.t : null, [hw, x2] = twoUp(ir), vs = on ? t.N : t.D;
    W.readout(scr, ir.x, y, hw, 'CPU', ct != null ? Math.round(ct) : '', '°C', vs, ct != null && ct >= S16_LIM.cpu, true, 3);
    W.readout(scr, x2, y, hw, 'GPU', gt != null ? Math.round(gt) : '', '°C', vs, gt != null && gt >= S16_LIM.gpu, true, 3);
    y += 6;
    if (ct == null && y < ir.b) scr.put(ir.x, y++, clip('CPU °C · HWINFO64: REPORT VALUE IN GADGET', ir.w), t.F);
    sub(scr, ir.x, y++, ir.w, 'LOAD', on ? 'LIVE · ' + ageTxt(now() - S16.t) : 'LAST KNOWN · ' + ageTxt(now() - S16.t), on ? t.D : t.R);
    const bar = (lab, frac, txt, al, red) => {
      if (y >= ir.b) return;
      scr.put(ir.x, y, lab, al ? t.RB : t.D); W.segBar(scr, ir.x + 7, y, Math.max(4, ir.w - 7 - 15), frac, red, al); W.rjust(scr, ir.r, y, txt, al ? t.RB : vs); y++;
    };
    if (o.cpu && o.cpu.l != null) bar('CPU', o.cpu.l / 100, Math.round(o.cpu.l) + ' %', false, null);
    if (o.gpu && o.gpu.l != null) bar('GPU', o.gpu.l / 100, Math.round(o.gpu.l) + ' %', false, null);
    if (o.gpu && o.gpu.mt) bar('VRAM', o.gpu.mu / o.gpu.mt, (o.gpu.mu / 1024).toFixed(1) + '/' + Math.round(o.gpu.mt / 1024) + ' GB', false, null);
    if (o.ram && o.ram.t) { const f = o.ram.u / o.ram.t; bar('RAM', f, (+o.ram.u).toFixed(1) + '/' + Math.round(o.ram.t) + ' GB', f * 100 >= S16_LIM.ram, S16_LIM.ram / 100); }
    for (const [dl, free] of o.disk || []) bar('DISK ' + dl, 1 - free / 100, free + ' % FREE', free <= S16_LIM.disk, 1 - S16_LIM.disk / 100);
    y++;
    kv('UPTIME', upTxt(o.up));
    if (o.gpu && o.gpu.p != null) kv('GPU POWER', Math.round(o.gpu.p) + ' W');
    kv('LINK', 'RX ' + S16.n + ' · ' + (on ? 'EVERY 5 S · LAN' : 'SILENT ' + ageTxt(now() - S16.t)), on ? t.N : t.RB);
    const H = S16.h;
    if (H && H.ct.length > 2 && ir.b - y >= 7) {
      y++;
      const g = this.g, a = g === 'T' ? H.ct : H.cl, b = g === 'T' ? H.gt : H.gl, tEnd = H.t0 + a.length * H.step;
      sub(scr, ir.x, y++, ir.w, (g === 'T' ? '°C' : 'LOAD %') + ' · ' + Math.round(a.length * H.step / 3600) + 'h', 'CPU · GPU DIM · [*1]', t.D);
      W.plot(scr, new Rect(ir.x, y, ir.w, ir.b - y), [[a, t.N], [b, t.D]], g === 'T'
        ? { auto: true, minSpan: 10, step: H.step, fit: true, area: false, fmt: v => String(Math.round(v)), limits: [[S16_LIM.cpu, 0, 'HOT']], tEnd, xfmt: sec => hhmm(tEnd - sec) }
        : { vmin: 0, vmax: 100, step: H.step, fit: true, area: false, fmt: v => String(Math.round(v)), tEnd, xfmt: sec => hhmm(tEnd - sec) });
    } else if (y < ir.b - 1) { y++; noData(scr, ir.x, y, ir.w, 'HISTORY · WITHIN A MINUTE OF THE LINK'); }
  } };


// ---------------------------------------------------------------------------------------- persistance
// Ce qui doit survivre à la fermeture de l'App : historiques batterie et pression (avec trou marqué), dernière
// météo (affichée « CACHED » jusqu'au prochain flux, 12 h au plus), dernier TLE, chrono et minuteur.
// Chaque clé est écrite à part (une clé trop grosse n'empêche plus les autres) ; un refus est noté une fois au journal.
// Les courbes ont une seconde source : le fichier du journal continu (APK), relu au démarrage (bgRequest(true)).
function persistSave() {
  const put = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) { if (!persistSave.err) { persistSave.err = 1; log('SYS', 'STORAGE REFUSED ' + k.toUpperCase() + ' · ' + String(e.name || e).toUpperCase(), true); } } };
  if (live('geo') && SRC.geo.mode === 'live' && SRC.geo.v.alt != null && SRC.geo.v.acc < 100) { BGL.alt = Math.round(SRC.geo.v.alt); bgSave(); }   // altitude pour le QNH hors GNSS
  put('grafit.hist', { batt: HIST.batt.dump(0), chg: HIST.chg.dump(0), press: HIST.press.dump(2), src: TREND_SRC,
    rtt: HIST.rtt.dump(0), act: HIST.act.dump(3), bt: HIST.bt.dump(1), sig: HIST.sig.dump(0) });
  put('grafit.health', HEALTH);
  put('grafit.chr', CHR);
  if (SRC.wx.mode === 'live' && SRC.wx.v.at && SRC.wx.v.at !== persistSave.wxAt) { put('grafit.wx', SRC.wx.v); persistSave.wxAt = SRC.wx.v.at; }
  daySave(); bgSave(); logDirty = true; logSave();
  try { localStorage.setItem('grafit.steps', JSON.stringify(STEPS)); } catch (e) { /* */ }
}
function persistLoad() {
  const get = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const h = get('grafit.hist');
  if (h) { HIST.batt.load(h.batt); HIST.chg.load(h.chg); HIST.rtt.load(h.rtt); HIST.act.load(h.act); HIST.bt.load(h.bt); HIST.sig.load(h.sig); if (h.src !== 'SIM') HIST.press.load(h.press); }
  const c = get('grafit.chr'); if (c) Object.assign(CHR, c);
  const w = get('grafit.wx');
  if (w && w.at && now() - w.at < 12 * 3600 && w.hms) {
    let ni = w.hms.findIndex(x => x > Date.now()) - 1; if (ni >= 0) w.ni = ni;
    Object.assign(SRC.wx.v, w); SRC.wx.mode = 'live'; SRC.wx.liveT = now(); SRC.wx.t = now(); persistSave.wxAt = w.at;
    log('WX', 'CACHED WEATHER · ' + hhmm(w.at));
  }
  try { const tx = localStorage.getItem('grafit.tle'), tl = tx && A.parseTle(tx); if (tl && tl.epoch > TLE.epoch) { TLE = tl; TLE_SRC = 'CACHED'; } } catch (e) { /* */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistSave(); });
window.addEventListener('pagehide', persistSave);

function boot() {
  loadSettings(); restoreTrend(); failRestore(); dayLoad(); agendaLoad(); persistLoad(); dayTick(true);
  if (APK) setTimeout(() => bgRequest(true), 300);
  if (APK) { nativeCmd({ cmd: 'keepOn', on: !!SET.wake }); nativeCmd({ cmd: 'immersive', on: !!SET.immersive }); setTimeout(() => bgCfgTick(true), 4000); setTimeout(() => widgetTick(true), 9000); }
  APP = new App();
  log('SYS', CFG.OS_RU + ' ' + CFG.VERSION + ' ONLINE · ' + CFG.STATION);
  R.measure(); relayout();
  startSensors();
  if (SET.wake) wakeSet(true);
  brightApply();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') brightApply(); });
  setInterval(fastTick, 100); setInterval(slowTick, 1000);
  setTimeout(fetchWx, 1500); setTimeout(fetchTle, 2500); setTimeout(fetchSatCat, 3500); setInterval(() => fetchSatCat(), 6 * 3600 * 1000); setInterval(fetchTle, 6 * 3600 * 1000);
  // rendu : requestAnimationFrame quand le navigateur le fournit, plus une minuterie de secours
  // (certains cadres intégrés suspendent requestAnimationFrame jusqu'au premier geste)
  const loop = () => { frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(() => frame(), 50);
  setTimeout(() => frame(true), 2300);
  if (document.fonts && document.fonts.load) document.fonts.load('400 16px "Martian Mono"').then(() => { R.measure(); relayout(); frame(true); }).catch(() => {});
}
boot();
