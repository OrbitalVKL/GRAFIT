// Grafit Mobile : coquille Android de la page Grafit (WebView sur les fichiers embarqués) et pont des capteurs
// que le navigateur ne donne pas. Version et signature fournies par la tâche GitHub (apk.yml).
plugins { id 'com.android.application' }

def ver = (project.findProperty('grafitVersion') ?: '0.0.0').toString()
def code = ver.tokenize('.').collect { it as int }.inject(0) { a, b -> a * 100 + b }

android {
    namespace 'fr.orbitalvkl.grafit'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.orbitalvkl.grafit'
        minSdk 30
        targetSdk 35
        versionCode code
        versionName ver
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
